# Copy for the shared email layout (ETP-5003).
# es_ES is the fallback bundle: a key missing from another language resolves here.
# {0}, {1}... are MessageFormat placeholders; see EmailMessages.

signature = Saludos, Equipo de Etendo Go
link.fallback = Si el botón no funciona, copia y pega el siguiente enlace en tu navegador:

invitation.subject = Invitación para unirte a {0}
invitation.greeting = Hola, {0}:
invitation.body = {0} te ha invitado a unirte a su organización en Etendo Go. Haz clic en el siguiente botón para aceptar la invitación y acceder a la organización.
invitation.cta = Aceptar invitación
invitation.note.expiry = Este enlace es personal y seguro. Tiene una validez de {0} d\u00edas.
invitation.note.ignore = Si no esperabas esta invitación, puedes ignorar este correo.

new-account.subject = Bienvenido a Etendo Go
new-account.greeting = Hola, {0}:
new-account.body = Tu cuenta de Etendo Go fue creada correctamente. Solo falta confirmar que este correo es tuyo: haz clic en el siguiente botón para continuar.
new-account.cta = Confirmar mi correo

environment-ready.subject = Tu entorno de Etendo Go está listo
environment-ready.greeting = Hola, {0}:
environment-ready.body = Tu entorno de Etendo Go ya está listo. Haz clic en el siguiente botón para acceder a tu panel.
environment-ready.cta = Ir a mi panel

reset-password.subject = Restablece tu contraseña de Etendo Go
reset-password.greeting = Hola, {0}:
reset-password.body = Recibimos una solicitud para restablecer la contraseña de tu cuenta de Etendo Go. Haz clic en el siguiente botón para elegir una nueva contraseña.
reset-password.cta = Restablecer contraseña
reset-password.note.expiry = Este enlace es personal y seguro. Caduca en {0} minutos.
reset-password.note.ignore = Si no solicitaste este cambio, puedes ignorar este correo: tu contraseña seguirá siendo la misma.

# ETP-5115 — la otra mitad del flujo de recuperación, para una cuenta que entra por un proveedor de
# identidad y por lo tanto no tiene contraseña local. Mismo enlace y mismo token que reset-password;
# solo cambia el texto, porque decirle a alguien que recibimos una solicitud para RESTABLECER una
# contraseña que nunca tuvo es cómo se logra que un flujo que funciona parezca un error.
set-password.subject = Crea una contraseña para tu cuenta de Etendo Go
set-password.greeting = Hola, {0}:
set-password.body = Recibimos una solicitud para acceder con contraseña a tu cuenta de Etendo Go. Todavía no tienes una: hasta ahora entras con tu proveedor de identidad. Haz clic en el siguiente botón para crear una y poder usar cualquiera de los dos métodos.
set-password.cta = Crear contraseña
set-password.note.expiry = Este enlace es personal y seguro. Caduca en {0} minutos.
set-password.note.ignore = Si no solicitaste esto, puedes ignorar este correo: tu cuenta seguirá entrando como hasta ahora.

password-changed.subject = Tu contraseña de Etendo Go fue modificada
password-changed.greeting = Hola, {0}:
password-changed.body = Tu contraseña de Etendo Go se modificó correctamente.
password-changed.note.warning = Si no realizaste este cambio, entra en Etendo Go y restablece tu contraseña desde «¿Olvidaste tu contraseña?», o contacta a soporte.

login-alert.subject = Nuevo inicio de sesión en tu cuenta de Etendo Go
login-alert.greeting = Hola, {0}:
login-alert.body = Detectamos un inicio de sesión en tu cuenta de Etendo Go el {1} desde la dirección IP {0}.
login-alert.note.warning = Si no fuiste tú, cambia tu contraseña y contacta a soporte.

organization-joined.subject = Te has unido a {0} en Etendo Go
organization-joined.greeting = Hola, {0}:
organization-joined.body = Ya formas parte de la organización {0} en Etendo Go. Haz clic en el siguiente botón para entrar y empezar a trabajar.
organization-joined.cta = Ir a Etendo Go

verify-email.subject = Confirma tu correo de Etendo Go
verify-email.greeting = Hola, {0}:
verify-email.body = Para terminar de configurar tu entorno de Etendo Go necesitamos confirmar que este correo es tuyo. Haz clic en el siguiente botón para confirmarlo.
verify-email.cta = Confirmar mi correo
verify-email.note.expiry = Este enlace es personal y seguro. Caduca en {0} horas.
verify-email.note.ignore = Si no creaste esta cuenta, puedes ignorar este correo.

new-account-invitee.subject = Bienvenido a Etendo Go
new-account-invitee.greeting = Hola, {0}:
new-account-invitee.body = Tu cuenta de Etendo Go fue creada correctamente. Haz clic en el siguiente botón para entrar.
new-account-invitee.cta = Ir a Etendo Go
new-account.note.expiry = El enlace de confirmación caduca en {0} horas.

