# Copy for the shared email layout (ETP-5003).
# es_ES is the fallback bundle: a key missing from another language resolves here.
# {0}, {1}... are MessageFormat placeholders; see EmailMessages.

signature = Saludos, Equipo de Etendo
link.fallback = Si el botón no funciona, copia y pega el siguiente enlace en tu navegador:

invitation.subject = Invitación para unirte a {0}
invitation.greeting = Hola, {0}:
invitation.body = {0} te ha invitado a unirte a su organización en Etendo. Haz clic en el siguiente botón para aceptar la invitación y acceder a la organización.
invitation.cta = Aceptar invitación
invitation.note.expiry = Este enlace es personal y seguro. Tiene una validez de {0} d\u00edas.
invitation.note.ignore = Si no esperabas esta invitación, puedes ignorar este correo.

new-account.subject = Bienvenido a Etendo
new-account.greeting = Hola, {0}:
new-account.body = Tu cuenta de Etendo fue creada correctamente. Haz clic en el siguiente botón para confirmar que este correo es tuyo y entrar a tu cuenta desde cualquier dispositivo.
new-account.cta = Confirmar y entrar

environment-ready.subject = Tu entorno de Etendo está listo
environment-ready.greeting = Hola, {0}:
environment-ready.body = Tu entorno de Etendo ya está listo. Haz clic en el siguiente botón para acceder a tu panel.
environment-ready.cta = Ir a mi panel

# ETP-5453 — avisos del fin de la prueba de una demo, enviados por el job diario. En el cuerpo,
# {0} es el nombre del entorno (ya escapado y en negrita), {1} la fecha de fin y {2} los días que
# quedan; en el asunto, {0} es el nombre y {1} los días. Las palabras son las de la pantalla de
# acceso bloqueado (blockedAccessDemoExpired*), para que el correo y la app digan lo mismo.
demo-trial-reminder.subject = Tu período de prueba de {0} termina en {1,choice,1#1 día|1<{1,number,integer} días}
demo-trial-reminder.greeting = Hola, {0}:
demo-trial-reminder.body = El período de prueba de {0} termina el {1}: te {2,choice,1#queda 1 día|1<quedan {2,number,integer} días}. Cuando termine, el acceso al entorno quedará en pausa, pero tus datos se conservan. Actualiza a un plan de pago para seguir trabajando sin interrupciones.
demo-trial-reminder.cta = Actualizar mi plan

demo-trial-expired.subject = Tu período de prueba de {0} terminó
demo-trial-expired.greeting = Hola, {0}:
demo-trial-expired.body = El período de prueba de {0} terminó el {1}. El acceso al entorno está en pausa, pero tus datos están a salvo y te esperan. Actualiza a un plan de pago para retomar justo donde lo dejaste.
demo-trial-expired.cta = Actualizar mi plan

reset-password.subject = Restablece tu contraseña de Etendo
reset-password.greeting = Hola, {0}:
reset-password.body = Recibimos una solicitud para restablecer la contraseña de tu cuenta de Etendo. Haz clic en el siguiente botón para elegir una nueva contraseña.
reset-password.cta = Restablecer contraseña
reset-password.note.expiry = Este enlace es personal y seguro. Caduca en {0} minutos.
reset-password.note.ignore = Si no solicitaste este cambio, puedes ignorar este correo: tu contraseña seguirá siendo la misma.

# ETP-5115 — la otra mitad del flujo de recuperación, para una cuenta que entra por un proveedor de
# identidad y por lo tanto no tiene contraseña local. Mismo enlace y mismo token que reset-password;
# solo cambia el texto, porque decirle a alguien que recibimos una solicitud para RESTABLECER una
# contraseña que nunca tuvo es cómo se logra que un flujo que funciona parezca un error.
set-password.subject = Crea una contraseña para tu cuenta de Etendo
set-password.greeting = Hola, {0}:
set-password.body = Recibimos una solicitud para acceder con contraseña a tu cuenta de Etendo. Todavía no tienes una. Haz clic en el siguiente botón para crearla: después podrás entrar con tu correo y tu contraseña.
set-password.cta = Crear contraseña
set-password.note.expiry = Este enlace es personal y seguro. Caduca en {0} minutos.
set-password.note.ignore = Si no solicitaste esto, puedes ignorar este correo: tu cuenta seguirá entrando como hasta ahora.

password-changed.subject = Tu contraseña de Etendo fue modificada
password-changed.greeting = Hola, {0}:
password-changed.body = Tu contraseña de Etendo se modificó correctamente.
password-changed.note.warning = Si no realizaste este cambio, entra en Etendo y restablece tu contraseña desde «¿Olvidaste tu contraseña?», o contacta a soporte.

# ETP-5115 — hermano de password-changed, para la primera contraseña de una cuenta que hasta ahora
# entraba solo por un proveedor de identidad. Decirle «se modificó» a quien acaba de crear la
# primera suena a que le tocaron algo que no tenía, que es justo la alarma que este aviso existe
# para no dar en falso.
password-added.subject = Ya puedes entrar con contraseña a Etendo
password-added.greeting = Hola, {0}:
password-added.body = Se creó una contraseña para tu cuenta de Etendo. A partir de ahora puedes entrar con tu proveedor de identidad o con esta contraseña, como prefieras.
password-added.note.warning = Si no fuiste tú, entra en Etendo y cambia tu contraseña desde «¿Olvidaste tu contraseña?», o contacta a soporte.

# ETP-5115 — aviso de que se quitó una forma de entrar. No nombra cuál a propósito: el contrato
# lleva una sola entrada de catálogo y nombrarlo exigiría interpolarlo, y lo que el dueño necesita
# saber es que las vías de acceso a su cuenta cambiaron sin él. El remedio es el mismo en los dos casos.
auth-method-removed.subject = Se quitó una forma de acceder a tu cuenta de Etendo
auth-method-removed.greeting = Hola, {0}:
auth-method-removed.body = Se quitó uno de los métodos con los que entras a tu cuenta de Etendo. Los que quedan siguen funcionando con normalidad.
auth-method-removed.note.warning = Si no fuiste tú, entra ahora mismo con el método que te quede y revisa la configuración de tu cuenta, o contacta a soporte.

login-alert.subject = Nuevo inicio de sesión en tu cuenta de Etendo
login-alert.greeting = Hola, {0}:
login-alert.body = Detectamos un inicio de sesión en tu cuenta de Etendo el {1} desde la dirección IP {0}.
login-alert.note.warning = Si no fuiste tú, cambia tu contraseña y contacta a soporte.

organization-joined.subject = Te has unido a {0} en Etendo
organization-joined.greeting = Hola, {0}:
organization-joined.body = Ya formas parte de la organización {0} en Etendo. Haz clic en el siguiente botón para entrar y empezar a trabajar.
organization-joined.cta = Ir a Etendo

verify-email.subject = Confirma tu correo de Etendo
verify-email.greeting = Hola, {0}:
verify-email.body = Para terminar de configurar tu entorno de Etendo necesitamos confirmar que este correo es tuyo. Haz clic en el siguiente botón para confirmarlo y entrar a tu cuenta.
verify-email.cta = Confirmar y entrar
verify-email.note.expiry = Este enlace es personal, sirve una sola vez y caduca en {0,choice,1#1 día|1<{0,number,integer} días}.
verify-email.note.ignore = Si no creaste esta cuenta, puedes ignorar este correo.

new-account-invitee.subject = Bienvenido a Etendo
new-account-invitee.greeting = Hola, {0}:
new-account-invitee.body = Tu cuenta de Etendo fue creada correctamente. Haz clic en el siguiente botón para entrar.
new-account-invitee.cta = Ir a Etendo
new-account.note.expiry = El enlace es personal, sirve una sola vez y caduca en {0,choice,1#1 día|1<{0,number,integer} días}. Después podrás entrar desde «¿Olvidaste tu contraseña?», que te permite crear una.

# Document emails. One shape for all six; only the document type changes.
document.subject = {0} #{1}
document.subject.withRecipient = {0} #{1} — {2}
document.greeting = Hola, **{0}**:
document.body = Le enviamos su {0} **{1}**.
document.cta = Descargar documento
# Portal de cliente (ETP-5267, ETP-6209). Lo usan presupuesto, pedido, albarán y factura de venta,
# solo cuando el flag bp-portal-link está activo para la cuenta que envía. {0} son las horas de
# validez del enlace. Con enlace, el botón del correo es document.portal.cta (lleva al portal) y
# sustituye al de descarga; el intro es una frase completa sin enlace.
document.portal.intro = Puede consultar este documento y el resto de sus documentos en su **portal de cliente**. El enlace es válido durante {0,choice,1#1 hora|1<{0,number,integer} horas}.
document.portal.cta = Ver documento en el portal
document.replyNote = Puedes responder a este correo y lo recibirá la persona que te envió el documento.
document.detail.dateFormat = dd/MM/yyyy
document.detail.date = Fecha
document.detail.dueDate = Vencimiento
document.detail.validUntil = Válido hasta
document.detail.total = Total
document.detail.movementDate = Fecha de movimiento
document.detail.shipDate = Fecha de envío
document.detail.orderDate = Fecha del pedido

