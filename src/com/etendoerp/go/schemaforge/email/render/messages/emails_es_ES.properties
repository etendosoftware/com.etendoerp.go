# Server-only operational alerts.
internal-alert.subject = [Etendo] {0} — {1} — {2}
internal-alert.body = Resultado interno de creación de entorno.
internal-alert.event = Evento
internal-alert.status = Resultado
internal-alert.environment = Tipo de entorno
internal-alert.attempt = Intento / correlación
internal-alert.client = Cliente
internal-alert.stage = Etapa
internal-alert.failure = Categoría de error
internal-alert.path = Ruta de provisioning

# ETP-6209 — a new customer portal link, emailed when an expired one is opened. Sent to the
# recipients of the original document email, never to whoever opened the link.
portal-link-renewal.subject = Su nuevo enlace al portal de cliente de {0}
portal-link-renewal.body = El enlace a su portal de cliente de **{0}** ha caducado. Aquí tiene uno nuevo para consultar {1} **{2}** y el resto de sus documentos.
portal-link-renewal.cta = Acceder a mi portal
portal-link-renewal.note.expiry = Este enlace es válido durante {0,choice,1#1 hora|1<{0,number,integer} horas}. Si caduca, ábralo de nuevo y le enviaremos otro.
# {1} de portal-link-renewal.body: el documento tal como lo nombra la frase, con artículo.
portal-link-renewal.document.QUOTATION = el presupuesto
portal-link-renewal.document.ORDER = el pedido
portal-link-renewal.document.SHIPMENT = el albarán
portal-link-renewal.document.INVOICE = la factura
portal-link-renewal.document.CREDIT_NOTE = la factura rectificativa

# ETP-6209 Part C — decisiones sobre presupuestos desde el portal de cliente.
# Confirmación al cliente: {0} acción (aceptar / rechazar), {1} número, {2} empresa.
portal-quotation-decision.confirm.subject = Confirme su decisión sobre el presupuesto {0}
portal-quotation-decision.confirm.body = Ha pedido **{0}** el presupuesto **{1}** de **{2}**. Pulse el botón para confirmarlo: la decisión se aplica en ese momento.
portal-quotation-decision.confirm.cta.ACCEPT = Confirmar aceptación
portal-quotation-decision.confirm.cta.REJECT = Confirmar rechazo
portal-quotation-decision.confirm.note = Si no lo ha pedido usted, ignore este correo: sin su confirmación no se aplica nada.
portal-quotation-decision.action.ACCEPT = aceptar
portal-quotation-decision.action.REJECT = rechazar
# Aviso a quien envió el presupuesto: {0} cliente, {1} resultado, {2} número.
portal-quotation-decision.notice.subject = {0} ha {1} el presupuesto {2}
portal-quotation-decision.notice.body = **{0}** ha **{1}** el presupuesto **{2}** desde el portal de cliente.
portal-quotation-decision.notice.note = La decisión ya está aplicada en el presupuesto. No se ha generado ningún pedido.
portal-quotation-decision.outcome.ACCEPT = aceptado
portal-quotation-decision.outcome.REJECT = rechazado
portal-quotation-decision.reason.label = Motivo
portal-quotation-decision.reason.PRICE = Precio
portal-quotation-decision.reason.DELIVERY = Plazo de entrega
portal-quotation-decision.reason.PAYMENT_TERMS = Condiciones de pago
portal-quotation-decision.reason.OTHER_SUPPLIER = He elegido otro proveedor
portal-quotation-decision.reason.NOT_NEEDED = Ya no lo necesito
portal-quotation-decision.reason.OTHER = Otros
