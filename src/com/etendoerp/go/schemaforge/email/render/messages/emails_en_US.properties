# Copy for the shared email layout (ETP-5003). See emails_es_ES.properties for the key reference.

signature = Best regards, the Etendo Go team
link.fallback = If the button does not work, copy and paste the following link into your browser:

invitation.subject = Invitation to join {0}
invitation.greeting = Hi {0},
invitation.body = {0} has invited you to join their organization on Etendo Go. Click the button below to accept the invitation and access the organization.
invitation.cta = Accept invitation
invitation.note.expiry = This link is personal and secure. It is valid for {0} days.
invitation.note.ignore = If you were not expecting this invitation, you can ignore this email.

new-account.subject = Welcome to Etendo Go
new-account.greeting = Hi {0},
new-account.body = Your Etendo Go account was created successfully. One step left: confirm this email address is yours by clicking the button below.
new-account.cta = Confirm my email

environment-ready.subject = Your Etendo Go environment is ready
environment-ready.greeting = Hi {0},
environment-ready.body = Your Etendo Go environment is ready. Click the button below to access your dashboard.
environment-ready.cta = Go to my dashboard

reset-password.subject = Reset your Etendo Go password
reset-password.greeting = Hi {0},
reset-password.body = We received a request to reset the password of your Etendo Go account. Click the button below to choose a new password.
reset-password.cta = Reset password
reset-password.note.expiry = This link is personal and secure. It expires in {0} minutes.
reset-password.note.ignore = If you did not request this change, you can ignore this email: your password will stay the same.

password-changed.subject = Your Etendo Go password was changed
password-changed.greeting = Hi {0},
password-changed.body = Your Etendo Go password was changed successfully.
password-changed.note.warning = If you did not make this change, go to Etendo Go and reset your password from "Forgot password?", or contact support.

login-alert.subject = New sign-in to your Etendo Go account
login-alert.greeting = Hi {0},
login-alert.body = We detected a sign-in to your Etendo Go account on {1} from IP address {0}.
login-alert.note.warning = If this was not you, change your password and contact support.

organization-joined.subject = You have joined {0} on Etendo Go
organization-joined.greeting = Hi {0},
organization-joined.body = You are now part of the {0} organization on Etendo Go. Click the button below to sign in and start working.
organization-joined.cta = Go to Etendo Go

verify-email.subject = Confirm your Etendo Go email address
verify-email.greeting = Hi {0},
verify-email.body = To finish setting up your Etendo Go environment we need to confirm this email address belongs to you. Click the button below to confirm it.
verify-email.cta = Confirm my email
verify-email.note.expiry = This link is personal and secure. It expires in {0} hours.
verify-email.note.ignore = If you did not create this account, you can ignore this email.

new-account-invitee.subject = Welcome to Etendo Go
new-account-invitee.greeting = Hi {0},
new-account-invitee.body = Your Etendo Go account was created successfully. Click the button below to sign in.
new-account-invitee.cta = Go to Etendo Go
new-account.note.expiry = The confirmation link expires in {0} hours.

# Document emails. One shape for all six; only the document type changes.
document.subject = {0} #{1}
document.subject.withRecipient = {0} #{1} — {2}
document.greeting = Hi {0},
document.body = Please find your {0} {1} attached below.
document.cta = Download document

sales-invoice-send.documentType = Sales Invoice
sales-order-send.documentType = Sales Order
sales-quotation-send.documentType = Sales Quotation
goods-shipment-send.documentType = Goods Shipment
purchase-order-send.documentType = Purchase Order
