# Avisos no bloqueantes de las respuestas de escritura NEO (ver NeoHints). Registro tu, sin voseo.
# Sirve a todas las variantes de espanol (es_ES, es_AR...).
# {0} = dias de historico que ofrece el banco, {1} = fecha mas antigua que puede ofrecer.
psd2ImportFromBeyondFetchInterval = Este banco sólo proporciona los últimos {0} días de movimientos (desde el {1}); la fecha de importación es anterior y los movimientos más antiguos no se importarán.
# ETP-5745 — SiiSendHandler#DRIFTED_CLASSIC_SENTENCES: the full GO-authored replacement for a
# classic SII pre-send validation whose named field has a current GO label (sales/purchase
# invoice window). No params.
siiMissingInvoiceType = La factura debe contener información en el campo Tipo factura.
siiMissingDocumentNo = La factura de compra debe contener información en el campo Nº documento.

# ETP-5840: document exchange-rate messages. Keys are the AD_MESSAGE values; this catalog is the
# versioned Spanish text (com.etendoerp.go exports no AD_MESSAGE_TRL). See DocumentRateMessages.
# {0} = moneda de la organizacion (ISO), {1} = moneda del documento (ISO), {2} = fecha de referencia,
# {3} = nombre de la fecha de referencia (ETGO_RateRefDate*).
ETGO_ExchangeRateMissingOnSave = No hay tipo de cambio de {0} a {1} para el {2} ({3}). Indique la Tasa de cambio en el documento o agregue el rango de conversión en Finanzas → Rangos de conversión.
# Se guarda con la Tasa de cambio vacia aunque el rango de conversion existe ({0}, {1} como arriba).
ETGO_ExchangeRateEmptyOnSave = La Tasa de cambio de {0} a {1} no puede quedar vacía. Indique la Tasa de cambio en el documento.
ETGO_ExchangeRateMissingOnComplete = No se puede confirmar el documento: falta la Tasa de cambio de {0} a {1}.
ETGO_RateRefDateAccounting = Fecha contable
ETGO_RateRefDateOrder = Fecha de pedido
ETGO_RateRefDateQuotation = Fecha de presupuesto

# ETP-5473: rechazos de pais de las cuentas financieras. Claves = valores AD_MESSAGE; este catalogo
# es el texto espanol versionado (com.etendoerp.go no exporta AD_MESSAGE_TRL). Ver NeoMessageText.
# Mismo texto que backendError.countryRequired / invalidCountry / countryIban del es_ES del SPA,
# para que MCP y UI digan lo mismo: si cambias uno, cambia el otro.
ETGO_FinAccCountryRequired = El país es obligatorio
ETGO_FinAccInvalidCountry = País no válido
ETGO_FinAccIbanRequiresCountry = Se necesita el País para una cuenta IBAN.

# ETP-5704: acciones de documento que la aplicacion no ofrece, rechazadas en todos los canales
# (REST, batch, MCP). Claves = valores AD_MESSAGE; este catalogo es el texto espanol versionado
# (com.etendoerp.go no exporta AD_MESSAGE_TRL). Ver DocActionRefusalGuard.
ETGO_SalesOrderCloseNotOffered = Los pedidos de venta no se pueden cerrar: la aplicación no ofrece Cerrar. Para modificar un pedido confirmado, reactívalo, edítalo y vuelve a confirmarlo.
ETGO_QuotationReactivateNotOffered = Los presupuestos no se pueden reactivar: la aplicación no ofrece Reactivar. Convierte en pedido el presupuesto en evaluación o recházalo; para volver a presupuestar, crea un presupuesto nuevo.
ETGO_DocActionCheckFailed = No se ha podido comprobar la acción del documento, así que no se ha ejecutado. Vuelve a intentarlo.

# ETP-6026: mas acciones de documento que la aplicacion no ofrece, rechazadas en todos los canales
# con el mismo DocActionRefusalGuard. Claves = valores AD_MESSAGE.
ETGO_SalesOrderVoidNotOffered = Este pedido de venta no se puede anular: la aplicación no ofrece Anular. Elimina el borrador o reactiva el pedido confirmado, edítalo y vuelve a confirmarlo.
ETGO_QuotationVoidNotOffered = Los presupuestos no se pueden anular: la aplicación no ofrece Anular. Elimina el presupuesto en borrador o rechaza el que está en evaluación.
ETGO_QuotationCloseNotOffered = Los presupuestos no se pueden cerrar: la aplicación no ofrece Cerrar. Convierte en pedido el presupuesto en evaluación o recházalo.
# ETP-6026: rechazo por lista blanca de cualquier otro valor de DocAction; {0} = el valor rechazado.
ETGO_SalesOrderActionNotOffered = La aplicación no ofrece la acción de documento {0} en este pedido de venta en su estado actual: solo confirma un pedido en borrador y reactiva uno confirmado. Consulta documentStatus y envía CO en un borrador, o RE en un pedido confirmado.
ETGO_QuotationActionNotOffered = La aplicación no ofrece la acción de documento {0} en este presupuesto en su estado actual: solo envía a evaluación un presupuesto en borrador (CO). Acepta un presupuesto en evaluación con Convertquotation o recházalo con rejectQuotation.

# ETP-6108: la lista permitida del pedido de compra, mismos rechazos que el pedido de venta. Las
# claves son los valores de AD_MESSAGE; mantén el texto sincronizado con su MSGTEXT; {0} = el valor rechazado.
ETGO_PurchaseOrderCloseNotOffered = Los pedidos de compra no se pueden cerrar: la aplicación no ofrece Cerrar. Para modificar un pedido completado, reactívalo, edítalo y vuelve a completarlo.
ETGO_PurchaseOrderVoidNotOffered = Este pedido de compra no se puede anular: la aplicación no ofrece Anular. Elimina el borrador o reactiva el pedido completado, edítalo y vuelve a completarlo.
ETGO_PurchaseOrderActionNotOffered = La aplicación no ofrece la acción de documento {0} en este pedido de compra en su estado actual: solo confirma un pedido en borrador y reactiva uno completado. Consulta documentStatus y envía CO en un borrador, o RE en un pedido completado.

# ETP-5726 (OBS-1): rechazo de un etendo_update que vacia un campo obligatorio. Claves = valores
# AD_MESSAGE; este catalogo es el texto espanol versionado (com.etendoerp.go no exporta
# AD_MESSAGE_TRL). Ver NeoMessageText. {0} = los campos vaciados, "nombre (etiqueta)" separados por comas.
ETGO_RequiredFieldsCleared = No se pueden vaciar los campos obligatorios: {0}
ETGO_RequiredFieldsClearedHint = Estos campos son obligatorios: envía un valor o no los incluyas en la actualización para conservar el actual.

# ETP-6013: rechazos de una escritura de adjuntos sobre un tipo de documento cuya seccion
# MCP_CONFIG.attachments declara readOnly:true (NeoAttachmentsConfig). Claves = valores AD_MESSAGE;
# este catalogo es el texto espanol versionado (com.etendoerp.go no exporta AD_MESSAGE_TRL). Ver
# NeoMessageText.
ETGO_AttachmentsReadOnly = Los adjuntos de este tipo de documento no se pueden modificar.
ETGO_TaxNotModifiable = Los impuestos no se pueden modificar.

# ETP-6013: rechazo del envio por correo (vista previa o envio) por estado del documento, declarado
# por contrato de envio. {0} = numero de documento, {1} = nombre del estado.
ETGO_EmailOnlyCompleted = {0} está en {1}: el envío por correo solo aplica a documentos Completados.
ETGO_EmailNotForDraft = {0} está en {1}: el envío por correo no aplica a documentos en Borrador.

# ETP-6013: Reactivar (docAction RE) sobre un borrador, rechazado antes de ejecutar el procedimiento
# (DocActionReactivationRule). {0} = numero de documento, {1} = nombre del estado.
ETGO_ReactivateOnlyCompleted = {0} está en {1}: Reactivar solo aplica a documentos Completados.

# ETP-6053: reglas de escritura de Configuración fiscal (FiscalSifGuard) y la acción
# configureFiscalSystem de sii-config/siiConfiguration (FiscalSystemConfigureAction).
# ETGO_FiscalSifTestMode es el texto del aviso del SPA (fiscal.testModeLock.warning).
ETGO_FiscalSifTestMode = Solo podrá activar un sistema fiscal en un entorno productivo.
ETGO_FiscalSifOneActive = Ya existe una configuración {0} activa para esta organización. Solo puede haber una configuración {0} activa por organización.
ETGO_FiscalSifInactiveCreate = Una configuración fiscal no se puede crear inactiva.
ETGO_FiscalSifActiveByAgent = El estado activo de una configuración fiscal no se puede cambiar desde un agente. Para cambiar de sistema de facturación (SIF) usa «Cambiar SIF» en Configuración fiscal de la aplicación.
ETGO_FiscalSifNotAllowed = El sistema fiscal {0} no está disponible para el territorio {1}. Sistemas disponibles: {2}.
ETGO_FiscalSifAlreadyConfigured = Esta organización ya tiene un sistema de facturación (SIF) activo: {0}. Para cambiarlo usa «Cambiar SIF» en Configuración fiscal.
ETGO_FiscalSifTerritoryMismatch = Solo se puede añadir SII a la configuración TicketBAI existente en su mismo territorio ({0}).
ETGO_FiscalSifOrgMismatch = La organización indicada no es la organización de tu sesión.
ETGO_FiscalSifOrgStar = No se puede activar un sistema de facturación en la organización «*». Usa la organización de tu empresa.
ETGO_FiscalSifNoCertificate = La organización no tiene certificado digital. Debe cargarse desde Configuración fiscal antes de poder enviar facturas.
ETGO_FiscalSifNoWindowAccess = Tu rol no tiene permiso para configurar {0}: no puede modificar su ventana.
ETGO_FiscalSifTerritoryRequired = El territorio fiscal es obligatorio para activar un sistema de facturación (SIF).
ETGO_FiscalSifTbaiNoTerritory = No se puede añadir SII: la configuración TicketBAI de esta organización no tiene territorio fiscal.
# ETP-6053: nombres de territorio como los muestra el SPA (fiscal.territory.* de su locale es_ES),
# solo en el catálogo (sin AD_MESSAGE): se imprimen dentro de los rechazos ETGO_FiscalSif*.
ETGO_FiscalSifTerritory_navarra = Navarra
ETGO_FiscalSifTerritory_alava = Álava
ETGO_FiscalSifTerritory_bizkaia = Vizcaya
ETGO_FiscalSifTerritory_gipuzkoa = Guipúzcoa
ETGO_FiscalSifTerritory_baleares = España / Baleares
ETGO_FiscalSifTerritory_canarias = Canarias (IGIC)
ETGO_FiscalSifTerritory_ceuta = Ceuta / Melilla (IPSI)

# ETP-6158: mensajes de los modulos fiscales clasicos (VERI*FACTU, TicketBAI, SII, AEAT 303/349/390)
# reescritos para GO por ClassicMessageRemap, a la salida de NEO (REST, batch y MCP). Clave = valor
# AD_MESSAGE del modulo clasico (su texto clasico NO se toca: lo comparte Classic). Sin HTML.
# Etiquetas GO verificadas en tools/app-shell/src/locales/es_ES.json de schema_forge: pestana
# "Rectificaciones" (rectificationsTab), solapa "SIF" (sifDataTabs.sectionTitle), "Tipo factura" /
# "Tipo de Factura" / "Descripción Operación" (sifDataTabs.field.*), seccion "Certificado digital"
# (fiscal.cert.section.legend) de "Configuración fiscal" (fiscal.onboarding.breadcrumb.fiscal),
# "Fecha incorporación al SII" (fiscal.sii.field.enrollDate), Contactos: "CIF/NIF" (TaxID),
# "Clave NIF País Residencia" (EM_OBTIK_Tax_ID_Key), "Factura Simplificada"
# (EM_Tbai_Issimplifiedinv), pestana "Dirección" (Location), "Primera línea" (addressLine1Label);
# factura: "Dirección"
# (C_BPartner_Location_ID).
ETVFAC_invoice_type_rectifying = Esta factura tiene facturas relacionadas en la pestaña Rectificaciones, así que el Tipo de Factura de VERI*FACTU (solapa SIF) debe ser rectificativo (R1 a R5) o F3 (emitida en sustitución de simplificadas).
ETVFAC_reversed_invoice = El Tipo de Factura de VERI*FACTU (solapa SIF) es rectificativo o F3 (emitida en sustitución de simplificadas): añade las facturas que rectifica en la pestaña Rectificaciones.
AEAT349_CINVREV_CHECK = Todas las facturas de la pestaña Rectificaciones deben tener el mismo Año y Periodo.
AEATSII_EmptyCertificatePath = No se ha encontrado ningún certificado válido. Sube el certificado de la organización en la sección Certificado digital de Configuración fiscal.
TBAI_CertificateNotValid = El certificado no es válido. Vuelve a subirlo en la sección Certificado digital de Configuración fiscal.
# {0} enviadas, {1} no enviadas, {2} enviadas antes, {3} detalle de errores (puede ir vacio).
AEATSII_InvoiceManualSending = Facturas enviadas con éxito: {0}. No enviadas: {1}. Enviadas previamente: {2}. {3}
# {0} = error de validacion del XML.
AEAT390_MARSHALLERROR = Error interno al generar el fichero XML: {0}. Suele deberse a que la estructura o algún dato de la declaración no es válido. Revisa los datos indicados en el error y vuelve a generar el fichero.
AEAT303_Periodicity_NotValid = El modelo 303 se presenta únicamente de forma trimestral o mensual. Elige un periodo trimestral o mensual.
AEAT349_Periodicity_NotValid = El modelo 349 se presenta únicamente de forma trimestral o anual. Elige un periodo trimestral o anual.
AEAT303_Period_NotDetected = Error interno al detectar el periodo de la declaración. Vuelve a intentarlo y, si el error persiste, contacta con soporte.
AEAT349_Period_NotDetected = Error interno al detectar el trimestre de la declaración. Vuelve a intentarlo y, si el error persiste, contacta con soporte.
ETVFAC_Missing_DocType_Config = No se puede enviar la factura a VERI*FACTU: su tipo de documento no tiene configurados el Tipo de Factura y la Descripción Operación de VERI*FACTU. Contacta con soporte para completar esa configuración.
AEATSII_SII_ACCRUAL_DATE_EMPTY = Falta la Fecha incorporación al SII en Configuración fiscal (pestaña SII). Complétala para poder guardar la factura.
TBAI_ConfigNotFound = No hay ninguna configuración de TicketBAI activa para esta organización. Revísala en Configuración fiscal (pestaña TicketBAI).
ETVFAC_error_code_idtype = El país de la dirección de facturación solo puede ser España cuando la Clave NIF País Residencia del contacto es 07 o 03, y con la clave 07 el país debe ser España. Revisa el país de la dirección y la Clave NIF País Residencia del contacto en Contactos.
TBAI_EmptyNifCode = El contacto no está marcado como Factura Simplificada, así que su CIF/NIF es obligatorio. Complétalo en Contactos.
TBAI_EmptyPostalCode = El contacto no está marcado como Factura Simplificada, así que la Dirección de la factura debe tener código postal. Complétalo en Contactos, pestaña Dirección.
TBAI_EmptyDir = El contacto no está marcado como Factura Simplificada, así que la Dirección de la factura debe tener completa la Primera línea (la calle). Complétala en Contactos, pestaña Dirección.
TBAI_SetKey = Faltan datos fiscales de TicketBAI para generar la factura: revisa en la solapa SIF el Código de Factura Rectificativa (si es rectificativa) y que los impuestos de las líneas tengan sus claves y causas de exención o no sujeción.
TBAI_NullCertificate = No se ha podido leer el certificado digital de la organización. Súbelo de nuevo en la sección Certificado digital de Configuración fiscal.

# ETP-6158: presentacion telematica (303/390) en produccion sin certificado. Solo catalogo (sin
# AD_MESSAGE). Mismo texto que fm.aeat.error.noCertificate del es_ES del SPA.
ETGO_FiscalSubmitNoCertificate = Esta organización no tiene un certificado configurado. Sube uno desde Configuración fiscal antes de presentar en producción (el modo de prueba no requiere certificado).
