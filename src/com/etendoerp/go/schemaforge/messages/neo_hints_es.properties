# Avisos no bloqueantes de las respuestas de escritura NEO (ver NeoHints). Registro tu, sin voseo.
# Sirve a todas las variantes de espanol (es_ES, es_AR...).
# {0} = dias de historico que ofrece el banco, {1} = fecha mas antigua que puede ofrecer.
psd2ImportFromBeyondFetchInterval = Este banco s\u00f3lo proporciona los \u00faltimos {0} d\u00edas de movimientos (desde el {1}); la fecha de importaci\u00f3n es anterior y los movimientos m\u00e1s antiguos no se importar\u00e1n.

# ETP-5840: document exchange-rate messages. Keys are the AD_MESSAGE values; this catalog is the
# versioned Spanish text (com.etendoerp.go exports no AD_MESSAGE_TRL). See DocumentRateMessages.
# {0} = moneda de la organizacion (ISO), {1} = moneda del documento (ISO), {2} = fecha de referencia,
# {3} = nombre de la fecha de referencia (ETGO_RateRefDate*).
ETGO_ExchangeRateMissingOnSave = No hay tipo de cambio de {0} a {1} para el {2} ({3}). Indique la Tasa de cambio en el documento o agregue el rango de conversi\u00f3n en Finanzas \u2192 Rangos de conversi\u00f3n.
# Se guarda con la Tasa de cambio vacia aunque el rango de conversion existe ({0}, {1} como arriba).
ETGO_ExchangeRateEmptyOnSave = La Tasa de cambio de {0} a {1} no puede quedar vac\u00eda. Indique la Tasa de cambio en el documento.
ETGO_ExchangeRateMissingOnComplete = No se puede confirmar el documento: falta la Tasa de cambio de {0} a {1}.
ETGO_RateRefDateAccounting = Fecha contable
ETGO_RateRefDateOrder = Fecha de pedido
ETGO_RateRefDateQuotation = Fecha de presupuesto
