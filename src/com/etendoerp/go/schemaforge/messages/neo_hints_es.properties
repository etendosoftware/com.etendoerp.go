# Avisos no bloqueantes de las respuestas de escritura NEO (ver NeoHints). Registro tu, sin voseo.
# Sirve a todas las variantes de espanol (es_ES, es_AR...).
# {0} = dias de historico que ofrece el banco, {1} = fecha mas antigua que puede ofrecer.
psd2ImportFromBeyondFetchInterval = Este banco s\u00f3lo proporciona los \u00faltimos {0} d\u00edas de movimientos (desde el {1}); la fecha de importaci\u00f3n es anterior y los movimientos m\u00e1s antiguos no se importar\u00e1n.
# ETP-5745 \u2014 SiiSendHandler#DRIFTED_CLASSIC_SENTENCES: the full GO-authored replacement for a
# classic SII pre-send validation whose named field has a current GO label (sales/purchase
# invoice window). No params.
siiMissingInvoiceType = La factura debe contener informaci\u00f3n en el campo Tipo factura.
siiMissingDocumentNo = La factura de compra debe contener informaci\u00f3n en el campo N\u00ba documento.

# ETP-5840: document exchange-rate messages. Keys are the AD_MESSAGE values; this catalog is the
# versioned Spanish text (com.etendoerp.go exports no AD_MESSAGE_TRL). See DocumentRateMessages.
# {0} = moneda de la organizacion (ISO), {1} = moneda del documento (ISO), {2} = fecha de referencia,
# {3} = nombre de la fecha de referencia (ETGO_RateRefDate*).
ETGO_ExchangeRateMissingOnSave = No hay tipo de cambio de {0} a {1} para el {2} ({3}). Indique la Tasa de cambio en el documento o agregue el rango de conversi\u00f3n en Finanzas \u2192 Rangos de conversi\u00f3n.
# Se guarda con la Tasa de cambio vacia aunque el rango de conversion existe ({0}, {1} como arriba).
ETGO_ExchangeRateEmptyOnSave = La Tasa de cambio de {0} a {1} no puede quedar vac\u00eda. Indique la Tasa de cambio en el documento.
ETGO_ExchangeRateMissingOnComplete = No se puede confirmar el documento: falta la Tasa de cambio de {0} a {1}.
ETGO_RateRefDateAccounting = Fecha contable
ETGO_RateRefDateOrder = Fecha de pedido
ETGO_RateRefDateQuotation = Fecha de presupuesto

# ETP-5473: rechazos de pais de las cuentas financieras. Claves = valores AD_MESSAGE; este catalogo
# es el texto espanol versionado (com.etendoerp.go no exporta AD_MESSAGE_TRL). Ver NeoMessageText.
# Mismo texto que backendError.countryRequired / invalidCountry / countryIban del es_ES del SPA,
# para que MCP y UI digan lo mismo: si cambias uno, cambia el otro.
ETGO_FinAccCountryRequired = El pa\u00eds es obligatorio
ETGO_FinAccInvalidCountry = Pa\u00eds no v\u00e1lido
ETGO_FinAccIbanRequiresCountry = Se necesita el Pa\u00eds para una cuenta IBAN.

# ETP-5704: acciones de documento que la aplicacion no ofrece, rechazadas en todos los canales
# (REST, batch, MCP). Claves = valores AD_MESSAGE; este catalogo es el texto espanol versionado
# (com.etendoerp.go no exporta AD_MESSAGE_TRL). Ver DocActionRefusalGuard.
ETGO_SalesOrderCloseNotOffered = Los pedidos de venta no se pueden cerrar: la aplicación no ofrece Cerrar. Para modificar un pedido confirmado, reactívalo, edítalo y vuelve a confirmarlo.
ETGO_QuotationReactivateNotOffered = Los presupuestos no se pueden reactivar: la aplicación no ofrece Reactivar. Convierte en pedido el presupuesto en evaluación o recházalo; para volver a presupuestar, crea un presupuesto nuevo.
ETGO_DocActionCheckFailed = No se ha podido comprobar la acción del documento, así que no se ha ejecutado. Vuelve a intentarlo.

# ETP-6026: mas acciones de documento que la aplicacion no ofrece, rechazadas en todos los canales
# con el mismo DocActionRefusalGuard. Claves = valores AD_MESSAGE.
ETGO_SalesOrderVoidNotOffered = Este pedido de venta no se puede anular: la aplicación no ofrece Anular. Elimina el borrador o reactiva el pedido confirmado, edítalo y vuelve a confirmarlo.
ETGO_QuotationVoidNotOffered = Los presupuestos no se pueden anular: la aplicación no ofrece Anular. Elimina el presupuesto en borrador o rechaza el que está en evaluación.
ETGO_QuotationCloseNotOffered = Los presupuestos no se pueden cerrar: la aplicación no ofrece Cerrar. Convierte en pedido el presupuesto en evaluación o recházalo.
# ETP-6026: rechazo por lista blanca de cualquier otro valor de DocAction; {0} = el valor rechazado.
ETGO_SalesOrderActionNotOffered = La aplicación no ofrece la acción de documento {0} en este pedido de venta en su estado actual: solo confirma un pedido en borrador y reactiva uno confirmado. Consulta documentStatus y envía CO en un borrador, o RE en un pedido confirmado.
ETGO_QuotationActionNotOffered = La aplicación no ofrece la acción de documento {0} en este presupuesto en su estado actual: solo envía a evaluación un presupuesto en borrador (CO). Acepta un presupuesto en evaluación con Convertquotation o recházalo con rejectQuotation.

# ETP-5726 (OBS-1): rechazo de un etendo_update que vacia un campo obligatorio. Claves = valores
# AD_MESSAGE; este catalogo es el texto espanol versionado (com.etendoerp.go no exporta
# AD_MESSAGE_TRL). Ver NeoMessageText. {0} = los campos vaciados, "nombre (etiqueta)" separados por comas.
ETGO_RequiredFieldsCleared = No se pueden vaciar los campos obligatorios: {0}
ETGO_RequiredFieldsClearedHint = Estos campos son obligatorios: env\u00eda un valor o no los incluyas en la actualizaci\u00f3n para conservar el actual.

# ETP-6013: rechazos de una escritura de adjuntos sobre un tipo de documento cuya seccion
# MCP_CONFIG.attachments declara readOnly:true (NeoAttachmentsConfig). Claves = valores AD_MESSAGE;
# este catalogo es el texto espanol versionado (com.etendoerp.go no exporta AD_MESSAGE_TRL). Ver
# NeoMessageText.
ETGO_AttachmentsReadOnly = Los adjuntos de este tipo de documento no se pueden modificar.
ETGO_TaxNotModifiable = Los impuestos no se pueden modificar.

# ETP-6013: rechazo del envio por correo (vista previa o envio) por estado del documento, declarado
# por contrato de envio. {0} = numero de documento, {1} = nombre del estado.
ETGO_EmailOnlyCompleted = {0} est\u00e1 en {1}: el env\u00edo por correo solo aplica a documentos Completados.
ETGO_EmailNotForDraft = {0} est\u00e1 en {1}: el env\u00edo por correo no aplica a documentos en Borrador.

# ETP-6013: Reactivar (docAction RE) sobre un borrador, rechazado antes de ejecutar el procedimiento
# (DocActionReactivationRule). {0} = numero de documento, {1} = nombre del estado.
ETGO_ReactivateOnlyCompleted = {0} est\u00e1 en {1}: Reactivar solo aplica a documentos Completados.

