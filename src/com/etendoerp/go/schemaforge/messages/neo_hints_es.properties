# Avisos no bloqueantes de las respuestas de escritura NEO (ver NeoHints). Registro tu, sin voseo.
# Sirve a todas las variantes de espanol (es_ES, es_AR...).
# {0} = dias de historico que ofrece el banco, {1} = fecha mas antigua que puede ofrecer.
psd2ImportFromBeyondFetchInterval = Este banco s\u00f3lo proporciona los \u00faltimos {0} d\u00edas de movimientos (desde el {1}); la fecha de importaci\u00f3n es anterior y los movimientos m\u00e1s antiguos no se importar\u00e1n.
