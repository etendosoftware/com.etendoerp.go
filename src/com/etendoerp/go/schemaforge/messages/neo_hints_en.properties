# Non-blocking hints added to NEO write responses (see NeoHints). English is the fallback.
# {0} = days of history the bank provides, {1} = earliest date it can provide.
psd2ImportFromBeyondFetchInterval = This bank only provides the last {0} days of transactions (since {1}); the import-from date is earlier and the older movements will not be imported.

# ETP-5840: document exchange-rate messages. Keys are the AD_MESSAGE values and the text mirrors
# their MSGTEXT (keep both in sync). See DocumentRateMessages.
# {0} = organization currency ISO code, {1} = document currency ISO code, {2} = reference date,
# {3} = reference date name (ETGO_RateRefDate*).
ETGO_ExchangeRateMissingOnSave = There is no exchange rate from {0} to {1} for {2} ({3}). Enter the Exchange rate on the document or add the conversion rate range in Finance \u2192 Conversion Rates.
# Saved with an empty Exchange rate although the conversion rate range exists ({0}, {1} as above).
ETGO_ExchangeRateEmptyOnSave = The Exchange rate from {0} to {1} cannot be left empty. Enter the Exchange rate on the document.
ETGO_ExchangeRateMissingOnComplete = The document cannot be confirmed: the Exchange rate from {0} to {1} is missing.
ETGO_RateRefDateAccounting = Accounting date
ETGO_RateRefDateOrder = Order date
ETGO_RateRefDateQuotation = Quotation date
