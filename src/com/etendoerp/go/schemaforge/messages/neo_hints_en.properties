# Non-blocking hints added to NEO write responses (see NeoHints). English is the fallback.
# {0} = days of history the bank provides, {1} = earliest date it can provide.
psd2ImportFromBeyondFetchInterval = This bank only provides the last {0} days of transactions (since {1}); the import-from date is earlier and the older movements will not be imported.
# ETP-5745 — SiiSendHandler#DRIFTED_CLASSIC_SENTENCES: the full GO-authored replacement for a
# classic SII pre-send validation whose named field has a current GO label (sales/purchase
# invoice window). No params.
siiMissingInvoiceType = The invoice must contain information in the Invoice type field.
siiMissingDocumentNo = The purchase invoice must contain information in the Document No. field.

# ETP-5840: document exchange-rate messages. Keys are the AD_MESSAGE values and the text mirrors
# their MSGTEXT (keep both in sync). See DocumentRateMessages.
# {0} = organization currency ISO code, {1} = document currency ISO code, {2} = reference date,
# {3} = reference date name (ETGO_RateRefDate*).
ETGO_ExchangeRateMissingOnSave = There is no exchange rate from {0} to {1} for {2} ({3}). Enter the Exchange rate on the document or add the conversion rate range in Finance → Conversion Rates.
# Saved with an empty Exchange rate although the conversion rate range exists ({0}, {1} as above).
ETGO_ExchangeRateEmptyOnSave = The Exchange rate from {0} to {1} cannot be left empty. Enter the Exchange rate on the document.
ETGO_ExchangeRateMissingOnComplete = The document cannot be confirmed: the Exchange rate from {0} to {1} is missing.
ETGO_RateRefDateAccounting = Accounting date
ETGO_RateRefDateOrder = Order date
ETGO_RateRefDateQuotation = Quotation date

# ETP-5473: financial-account country refusals. Keys are the AD_MESSAGE values and the text mirrors
# their MSGTEXT (keep both in sync). See NeoMessageText / FinancialAccountHandler.
ETGO_FinAccCountryRequired = Country is required
ETGO_FinAccInvalidCountry = Invalid country
ETGO_FinAccIbanRequiresCountry = A bank account with an IBAN must have a country.

# ETP-5704: document actions the app does not offer, refused on every channel (REST, batch, MCP).
# Keys are the AD_MESSAGE values and the text mirrors their MSGTEXT (keep both in sync). See
# DocActionRefusalGuard.
ETGO_SalesOrderCloseNotOffered = Sales orders cannot be closed: the app does not offer Close. To change a booked order, reactivate it, edit it and complete it again.
ETGO_QuotationReactivateNotOffered = Quotations cannot be reactivated: the app does not offer Reactivate. Convert a quotation under evaluation into an order or reject it; to quote again, create a new quotation.
ETGO_DocActionCheckFailed = The document action could not be checked, so it has not been run. Try again.

# ETP-6026: more document actions the app does not offer, refused on every channel through the same
# DocActionRefusalGuard. Keys are the AD_MESSAGE values; keep the text in sync with their MSGTEXT.
ETGO_SalesOrderVoidNotOffered = This sales order cannot be voided: the app does not offer Void. Delete a draft instead, or reactivate a booked order, edit it and confirm it again.
ETGO_QuotationVoidNotOffered = Quotations cannot be voided: the app does not offer Void. Delete a draft quotation, or reject one under evaluation.
ETGO_QuotationCloseNotOffered = Quotations cannot be closed: the app does not offer Close. Convert a quotation under evaluation into an order, or reject it.
# ETP-6026: the allow-list refusal of every other DocAction value; {0} = the refused value.
ETGO_SalesOrderActionNotOffered = The app does not offer document action {0} on this sales order in its current status: it only confirms a draft order and reactivates a booked one. Read documentStatus and send CO on a draft, or RE on a booked order.
ETGO_QuotationActionNotOffered = The app does not offer document action {0} on this quotation in its current status: it only sends a draft quotation to evaluation (CO). Accept a quotation under evaluation with Convertquotation or reject it with rejectQuotation.

# ETP-6108: the purchase order's allow-list, same refusals as the sales order's. Keys are the
# AD_MESSAGE values; keep the text in sync with their MSGTEXT; {0} = the refused value.
ETGO_PurchaseOrderCloseNotOffered = Purchase orders cannot be closed: the app does not offer Close. To change a completed order, reactivate it, edit it and complete it again.
ETGO_PurchaseOrderVoidNotOffered = This purchase order cannot be voided: the app does not offer Void. Delete a draft instead, or reactivate a completed order, edit it and complete it again.
ETGO_PurchaseOrderActionNotOffered = The app does not offer document action {0} on this purchase order in its current status: it only confirms a draft order and reactivates a completed one. Read documentStatus and send CO on a draft, or RE on a completed order.

# ETP-5726 (OBS-1): refusal of an etendo_update that clears a required field. Keys are the
# AD_MESSAGE values and the text mirrors their MSGTEXT (keep both in sync). See NeoMessageText.
# {0} = the cleared fields, "name (label)" separated by commas.
ETGO_RequiredFieldsCleared = Required fields cannot be cleared: {0}
ETGO_RequiredFieldsClearedHint = These fields are required: send a value for them, or leave them out of the update to keep the stored one.

# ETP-6013: refusals of an attachment write on a document type whose MCP_CONFIG.attachments section
# declares readOnly:true (NeoAttachmentsConfig). Keys are the AD_MESSAGE values and the text mirrors
# their MSGTEXT (keep both in sync). ETGO_AttachmentsReadOnly is the default; a section may declare
# its own messageKey, as the tax spec does.
ETGO_AttachmentsReadOnly = The attachments of this document type cannot be modified.
ETGO_TaxNotModifiable = Taxes cannot be modified.

# ETP-6013: refusal of a document email (preview or send) by document status, declared per send
# contract (DefaultDocumentSendEmailContract#isSendableStatus). Keys are the AD_MESSAGE values and the
# text mirrors their MSGTEXT (keep both in sync). {0} = document number, {1} = status name.
ETGO_EmailOnlyCompleted = {0} is {1}: sending by email only applies to Completed documents.
ETGO_EmailNotForDraft = {0} is {1}: sending by email does not apply to Draft documents.

# ETP-6013: Reactivate (docAction RE) on a draft, refused before the procedure runs
# (DocActionReactivationRule). Key = AD_MESSAGE value, text mirrors its MSGTEXT (keep both in sync).
# {0} = document number, {1} = status name.
ETGO_ReactivateOnlyCompleted = {0} is {1}: Reactivate only applies to Completed documents.

# ETP-6053: Fiscal Configuration write rules (FiscalSifGuard) and the configureFiscalSystem action
# of sii-config/siiConfiguration (FiscalSystemConfigureAction). Key = AD_MESSAGE value, text
# mirrors its MSGTEXT.
ETGO_FiscalSifTestMode = A fiscal system can only be activated in a production environment.
ETGO_FiscalSifOneActive = This organization already has an active {0} configuration. Only one active {0} configuration per organization is allowed.
ETGO_FiscalSifInactiveCreate = A fiscal configuration cannot be created inactive.
ETGO_FiscalSifActiveByAgent = The active state of a fiscal configuration cannot be changed by an agent. To change the billing system (SIF) use "Cambiar SIF" in Configuración fiscal in the app.
ETGO_FiscalSifNotAllowed = The fiscal system {0} is not available for territory {1}. Systems available there: {2}.
ETGO_FiscalSifAlreadyConfigured = This organization already has an active billing system (SIF): {0}. To change it use "Cambiar SIF" in Configuración fiscal.
ETGO_FiscalSifTerritoryMismatch = SII can only be added to the existing TicketBAI configuration in its own territory ({0}).
ETGO_FiscalSifOrgMismatch = The organization is not the organization of your session.
ETGO_FiscalSifOrgStar = A billing system cannot be activated on the "*" organization. Use the organization of your company.
ETGO_FiscalSifNoCertificate = The organization has no digital certificate. It must be uploaded from Configuración fiscal before invoices can be sent.
ETGO_FiscalSifNoWindowAccess = Your role is not allowed to configure {0}: it has no write access to its window.
ETGO_FiscalSifTerritoryRequired = The fiscal territory is required to activate a billing system (SIF).
ETGO_FiscalSifTbaiNoTerritory = SII cannot be added: the TicketBAI configuration of this organization has no fiscal territory.
# ETP-6053: territory names as the SPA shows them (fiscal.territory.* of its en_US locale), catalog
# only (no AD_MESSAGE): printed inside the ETGO_FiscalSif* refusals.
ETGO_FiscalSifTerritory_navarra = Navarre
ETGO_FiscalSifTerritory_alava = Álava
ETGO_FiscalSifTerritory_bizkaia = Vizcaya
ETGO_FiscalSifTerritory_gipuzkoa = Guipúzcoa
ETGO_FiscalSifTerritory_baleares = Spain / Balearic Islands
ETGO_FiscalSifTerritory_canarias = Canary Islands (IGIC)
ETGO_FiscalSifTerritory_ceuta = Ceuta / Melilla (IPSI)

# ETP-6158: Classic fiscal module messages (VERI*FACTU, TicketBAI, SII, AEAT 303/349/390) reworded
# for GO by ClassicMessageRemap on NEO's way out (REST, batch, MCP). Key = the Classic AD_MESSAGE
# value (its Classic text is NOT changed: Classic shares it). No HTML. GO labels as the SPA's
# en_US locale spells them (see the es catalog for the keys).
ETVFAC_invoice_type_rectifying = This invoice has related invoices in the Rectifications tab, so its VERI*FACTU Invoice type (SIF tab) must be a corrective one (R1 to R5) or F3 (issued to replace simplified invoices).
ETVFAC_reversed_invoice = The VERI*FACTU Invoice type (SIF tab) is a corrective one or F3 (issued to replace simplified invoices): add the invoices it corrects in the Rectifications tab.
AEAT349_CINVREV_CHECK = All the invoices in the Rectifications tab must have the same Year and Period.
AEATSII_EmptyCertificatePath = No valid certificate was found. Upload the organization certificate in the Digital certificate section of Fiscal configuration.
TBAI_CertificateNotValid = The certificate is not valid. Upload it again in the Digital certificate section of Fiscal configuration.
AEATSII_InvoiceManualSending = Invoices sent successfully: {0}. Not sent: {1}. Previously sent: {2}. {3}
AEAT390_MARSHALLERROR = Internal error while generating the XML file: {0}. This is usually caused by an invalid structure or value in the return. Check the data named in the error and generate the file again.
AEAT303_Periodicity_NotValid = Form 303 is only filed quarterly or monthly. Choose a quarterly or monthly period.
AEAT349_Periodicity_NotValid = Form 349 is only filed quarterly or annually. Choose a quarterly or annual period.
AEAT303_Period_NotDetected = Internal error while detecting the period of the return. Try again and, if the error persists, contact support.
AEAT349_Period_NotDetected = Internal error while detecting the quarter of the return. Try again and, if the error persists, contact support.
ETVFAC_Missing_DocType_Config = The invoice cannot be sent to VERI*FACTU: its document type has no VERI*FACTU Invoice type and Operation description configured. Contact support to complete that configuration.
AEATSII_SII_ACCRUAL_DATE_EMPTY = The SII enrollment date is missing in Fiscal configuration (SII tab). Fill it in to save the invoice.
TBAI_ConfigNotFound = There is no active TicketBAI configuration for this organization. Check it in Fiscal configuration (TicketBAI tab).
ETVFAC_null_description = The Operation description field of the SIF tab (VERI*FACTU) cannot be empty.
ETVFAC_error_code_idtype = The country of the billing address can only be Spain when the contact Residence Country Tax ID Key is 07 or 03, and with key 07 the country must be Spain. Check the address country and the contact Residence Country Tax ID Key in Contacts.
TBAI_EmptyNifCode = The contact is not marked as Simplified Invoice, so its Tax ID is required. Fill it in in Contacts.
TBAI_EmptyPostalCode = The contact is not marked as Simplified Invoice, so the invoice Partner Address must have a postal code. Fill it in in Contacts, Location tab.
TBAI_EmptyDir = The contact is not marked as Simplified Invoice, so the invoice Partner Address must have its First line (the street) filled in. Fill it in in Contacts, Location tab.
TBAI_SetKey = TicketBAI fiscal data is missing to generate the invoice: check the Corrective Invoice Code in the SIF tab (for a corrective invoice) and that the line taxes have their keys and exemption or non-subject causes.
TBAI_NullCertificate = The organization digital certificate could not be read. Upload it again in the Digital certificate section of Fiscal configuration.

# ETP-6158: telematic filing (303/390) in production without a certificate. Catalog only (no
# AD_MESSAGE). Same text as fm.aeat.error.noCertificate of the SPA en_US locale.
ETGO_FiscalSubmitNoCertificate = This organization has no certificate configured. Upload one from Fiscal configuration before submitting in production (test mode does not require a certificate).
