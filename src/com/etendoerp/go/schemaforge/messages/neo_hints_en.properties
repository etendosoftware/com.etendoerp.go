# Non-blocking hints added to NEO write responses (see NeoHints). English is the fallback.
# {0} = organization currency ISO code, {1} = document currency ISO code, {2} = invoice date.
exchangeRateMissing = No exchange rate from {0} to {1} for {2}; send eTGOCurrencyRate.
# {0} = days of history the bank provides, {1} = earliest date it can provide.
psd2ImportFromBeyondFetchInterval = This bank only provides the last {0} days of transactions (since {1}); the import-from date is earlier and the older movements will not be imported.
# ETP-5745 — SiiSendHandler#DRIFTED_CLASSIC_SENTENCES: the full GO-authored replacement for a
# classic SII pre-send validation whose named field has a current GO label (sales/purchase
# invoice window). No params.
siiMissingInvoiceType = The invoice must contain information in the Invoice type field.
siiMissingDocumentNo = The purchase invoice must contain information in the Document No. field.
