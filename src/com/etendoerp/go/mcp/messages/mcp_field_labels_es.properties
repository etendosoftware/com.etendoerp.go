# Field labels and descriptions shown to agents by etendo_schema (see McpFieldLabels).
# Serves every Spanish variant (es_ES, es_AR...). Keyed by <AD_Table.TableName>.<AD_Column.ColumnName>
# (label) and <TableName>.<ColumnName>.description; an entry wins over AD_FIELD_TRL and
# AD_FIELD.name / AD_FIELD.description. Only for fields com.etendoerp.go adds, whose AD_FIELD_TRL is
# never exported. No English file: English comes from AD_FIELD.

C_Order.EM_ETGO_Currency_Rate = Tasa de cambio
C_Order.EM_ETGO_Currency_Rate.description = Tasa de cambio de la moneda de la organizaci\u00f3n a la del documento en su fecha de referencia. Se recalcula al cambiar la moneda o esa fecha; editable. Un documento en moneda extranjera no se puede guardar ni confirmar sin ella.
C_Invoice.EM_ETGO_Currency_Rate = Tasa de cambio
C_Invoice.EM_ETGO_Currency_Rate.description = Tasa de cambio de la moneda de la organizaci\u00f3n a la del documento en su fecha de referencia. Se recalcula al cambiar la moneda o esa fecha; editable. Un documento en moneda extranjera no se puede guardar ni confirmar sin ella.

# ETP-5806 CP-10b (QA finding) \u2014 the structured SEPA address columns on C_Location have no
# AD_FIELD_TRL export (added by org.openbravo.sepa.iso20022, not this module), so etendo_schema
# fell back to the raw AD_Field name ("EM_OBSEPA_ Street Name", etc.) instead of the label the
# Contacts address editor already shows.
C_Location.EM_OBSEPA_StrtNm = Calle
C_Location.EM_OBSEPA_StrtNm.description = Nombre de la calle de la direcci\u00f3n. Obligatorio en Etendo Go.
C_Location.EM_OBSEPA_BldgNb = N\u00famero
C_Location.EM_OBSEPA_BldgNb.description = N\u00famero de edificio de la direcci\u00f3n. Si se omite y hay calle, se guarda como "s/n".
C_Location.EM_OBSEPA_BldgNm = Nombre del edificio
C_Location.EM_OBSEPA_BldgNm.description = Nombre del edificio de la direcci\u00f3n, opcional.

# ETP-6365 \u2014 conversion rates (story F.26): what the origin and the state of a rate mean to an agent.
C_Conversion_Rate.EM_Etgo_Rate_Status = Estado
C_Conversion_Rate.EM_Etgo_Rate_Status.description = Estado de la tasa: CURRENT = Vigente (su periodo contiene el momento actual; es la que usan los documentos nuevos), HISTORIC = Hist\u00f3rico (su periodo ya termin\u00f3).
C_Conversion_Rate.EM_SMFCR_Is_Synced = Autom\u00e1tica
C_Conversion_Rate.EM_SMFCR_Is_Synced.description = Origen de la tasa: true = Autom\u00e1tica (descargada cada d\u00eda por el servicio de tipos de cambio; no se puede modificar ni eliminar), false = Manual (cargada por un usuario).
