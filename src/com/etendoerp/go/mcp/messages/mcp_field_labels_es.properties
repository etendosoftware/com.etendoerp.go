# Field labels and descriptions shown to agents by etendo_schema (see McpFieldLabels).
# Serves every Spanish variant (es_ES, es_AR...). Keyed by <AD_Table.TableName>.<AD_Column.ColumnName>
# (label) and <TableName>.<ColumnName>.description; an entry wins over AD_FIELD_TRL and
# AD_FIELD.name / AD_FIELD.description. Only for fields com.etendoerp.go adds, whose AD_FIELD_TRL is
# never exported. No English file: English comes from AD_FIELD.

C_Order.EM_ETGO_Currency_Rate = Tasa de cambio
C_Order.EM_ETGO_Currency_Rate.description = Tasa de cambio de la moneda de la organizaci\u00f3n a la del documento en su fecha de referencia. Se recalcula al cambiar la moneda o esa fecha; editable. Un documento en moneda extranjera no se puede guardar ni confirmar sin ella.
C_Invoice.EM_ETGO_Currency_Rate = Tasa de cambio
C_Invoice.EM_ETGO_Currency_Rate.description = Tasa de cambio de la moneda de la organizaci\u00f3n a la del documento en su fecha de referencia. Se recalcula al cambiar la moneda o esa fecha; editable. Un documento en moneda extranjera no se puede guardar ni confirmar sin ella.
