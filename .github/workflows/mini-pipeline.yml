name: Mini Pipeline

# ETP-5695: the per-PR mini pipeline. On every PR into develop: the core and the extra modules,
# install against a throwaway Postgres (GenerateEntitiesTask reads the dictionary from the database
# to write src-gen, which the core needs to compile), then goTestUnit, the module's database-free
# tests. It runs here rather than in Jenkins: on the same commit and tests the Jenkins version took
# more than twice as long, mostly waiting for its pod and cloning what it did not need.
#
# ETP-5838: then the database-backed tests, against the database the install built. Before, they
# first ran on the daily cut into main, where one broken test held up the whole day's release
# (etendo-go-tests #2403 failed after ~1h21m on a fixture that this job's database lacks too).
#
# ETP-6180: Sonar, as in etendo_schema_forge's test.yml. It runs on every PR (into develop or main)
# and on every push to develop and main, the tests always run whole, with JaCoCo, and "Sonar Build"
# publishes the analysis with that coverage. On a PR it also compares the overall coverage with
# the base branch (scripts/compare-sonar-coverage.py, the rule of Jenkins' "Compare Coverage
# Results": at least 70 %, no more than 1 point below the base). The pushes are what keep
# develop's and main's coverage real on Sonar: the former Sonar Build (sonar-scan.yml) analyzed
# without tests, so both stood at 0 % and the comparison could never fail. This job is now the
# required "Sonar Build" check; sonar-scan.yml is gone. A push also fills the Gradle cache that the
# next PRs restore; PRs only read that cache, never save one of their own (ETP-6069).
#
# Secrets: ETENDOBOT_TOKEN reads etendo_core and the GitHub modules; NEXUS_USER/NEXUS_PASSWORD
# resolve dependencies; BITBUCKET_SSH_KEY (read access to bitbucket.org/koodu_software) clones the
# Bitbucket modules listed in jenkinsExtraModules.txt, which this module's code imports;
# SONAR_TOKEN/SONAR_HOST_URL publish the analysis, and SONAR_READ_TOKEN (Browse permission on the
# project: the analysis token gets 403) reads the coverage for the comparison.

on:
  pull_request:
    branches: [develop, main]
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [develop, main]
  workflow_dispatch:

# The checkouts of other repos use ETENDOBOT_TOKEN; the workflow's own token only reads this one.
permissions:
  contents: read

# A new push to a PR replaces its running check. Each push to develop or main keeps its own run (its
# own sha group, never cancelled): its analysis is the base the next PRs are compared with.
concurrency:
  group: mini-pipeline-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go-test:
    name: goTest
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: syspass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      CORE_BRANCH: epic/ETP-3504
      MODULE_BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      # The Jenkins pod starts Postgres with these off; a service container takes no arguments,
      # but all three can be changed on a running server.
      - name: Tune Postgres for a throwaway database
        env:
          PGPASSWORD: syspass
        run: |
          psql -h localhost -U postgres \
            -c "ALTER SYSTEM SET fsync = off" \
            -c "ALTER SYSTEM SET synchronous_commit = off" \
            -c "ALTER SYSTEM SET full_page_writes = off" \
            -c "SELECT pg_reload_conf()"

      - name: Checkout etendo_core
        uses: actions/checkout@v4
        with:
          repository: etendosoftware/etendo_core
          token: ${{ secrets.ETENDOBOT_TOKEN }}
          ref: ${{ env.CORE_BRANCH }}
          path: etendo_core

      - name: Checkout com.etendoerp.go
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: etendo_core/modules/com.etendoerp.go

      # Same branch choice as moduleBranchUtils.groovy: the PR's branch when the module has it
      # (never for develop, main, hotfix/* or mergeblock/*), otherwise the core's branch.
      - name: Clone the extra modules
        env:
          BITBUCKET_SSH_KEY: ${{ secrets.BITBUCKET_SSH_KEY }}
          ETENDOBOT_TOKEN: ${{ secrets.ETENDOBOT_TOKEN }}
        run: |
          if [ -z "$BITBUCKET_SSH_KEY" ]; then
            echo "::error::BITBUCKET_SSH_KEY is not set: the modules on bitbucket.org/koodu_software cannot be cloned."
            exit 1
          fi
          mkdir -p ~/.ssh
          # A key saved with Windows line endings fails to load ("error in libcrypto"): drop the CRs.
          printf '%s\n' "$BITBUCKET_SSH_KEY" | tr -d '\r' > ~/.ssh/bitbucket
          chmod 600 ~/.ssh/bitbucket
          if ! ssh-keygen -y -P '' -f ~/.ssh/bitbucket >/dev/null 2>&1; then
            crlf=no; case "$BITBUCKET_SSH_KEY" in *$'\r'*) crlf=yes ;; esac
            echo "::error::BITBUCKET_SSH_KEY is not a usable private key ($(wc -l < ~/.ssh/bitbucket) lines, CRLF: $crlf)." \
              "Store the whole key, BEGIN and END lines included, with its line breaks and no passphrase."
            exit 1
          fi
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/bitbucket -o StrictHostKeyChecking=no"
          case "$MODULE_BRANCH" in
            develop|main|hotfix/*|mergeblock/*) try_branch="" ;;
            *) try_branch="$MODULE_BRANCH" ;;
          esac
          cd etendo_core/modules
          for url in $(tr ',' ' ' < com.etendoerp.go/jenkinsExtraModules.txt); do
            name="$(basename "$url" .git)"
            case "$url" in
              git@github.com:*) url="https://x-access-token:${ETENDOBOT_TOKEN}@github.com/${url#git@github.com:}" ;;
            esac
            if [ -n "$try_branch" ] && git clone -q --depth 1 --branch "$try_branch" "$url" "$name" 2>/dev/null; then
              echo "$name: $try_branch"
            else
              git clone -q --depth 1 --branch "$CORE_BRANCH" "$url" "$name"
              echo "$name: $CORE_BRANCH"
            fi
          done

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The Gradle cache keys on the build files of the core and the cloned modules, so it runs after
      # the checkouts. Without it prepareConfig spends 3.5-4.7 min downloading dependencies.
      # ETP-6069: setup-java's `cache: gradle` only restored an exact key, so a PR touching any
      # *.gradle file downloaded everything and then uploaded its own ~350 MB copy, which only that
      # PR could use and which pushed develop's out of the repo's 10 GB. Now only a push to develop
      # saves (actions/cache saves on an exact-key miss only); a PR restores read-only, falling back
      # to the newest develop entry through restore-keys, so Gradle downloads just what changed.
      - name: Gradle cache (saved on develop)
        if: github.event_name == 'push'
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('etendo_core/**/*.gradle*', 'etendo_core/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Gradle cache (read-only)
        if: github.event_name != 'push'
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('etendo_core/**/*.gradle*', 'etendo_core/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Configure gradle.properties
        working-directory: etendo_core
        run: |
          cat > gradle.properties <<EOF
          context.name=etendo
          bbdd.sid=etendo
          bbdd.port=5432
          bbdd.systemUser=postgres
          bbdd.systemPassword=syspass
          bbdd.user=tad
          bbdd.password=tad
          nexusUser=${{ secrets.NEXUS_USER }}
          nexusPassword=${{ secrets.NEXUS_PASSWORD }}
          githubUser=etendobot
          githubToken=${{ secrets.ETENDOBOT_TOKEN }}
          etendo.go.runtime.environment=local
          allow.root=true
          org.gradle.daemon=false
          org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
          EOF

      - name: Install
        id: install
        working-directory: etendo_core
        run: |
          ./gradlew prepareConfig
          ./gradlew setup
          ./gradlew install

      # Both halves in one Gradle invocation: each separate ./gradlew call paid ~2.5 min of
      # configuration. --continue still runs goIsolatedDalTest when goTestUnit fails, so one run
      # reports both halves, each under its own build/reports/tests folder. goTestUnit never writes
      # to the database, so the DAL tests start from the same clean data as on Jenkins.
      # goIsolatedDalTest is called directly, not through `test --tests '...IntegrationTest'`: that
      # root test task matched nothing (it excludes these classes) and cost ~2 min before finalizing
      # into goIsolatedDalTest, which runs them all in one JVM (docs/test-jvm-isolation.md).
      - name: goTestUnit and integration tests
        working-directory: etendo_core
        run: ./gradlew goTestUnit goIsolatedDalTest --continue

      # A Gradle invocation of its own: jacocoRootReport reads every build/jacoco/*.exec without
      # declaring the test tasks that write them, and Gradle 8 fails a build that runs it next to
      # them. Only after the tests passed, so Sonar never gets the coverage of a partial run.
      - name: Coverage report
        working-directory: etendo_core
        run: ./gradlew jacocoRootReport

      - name: Upload the coverage report
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: etendo_core/build/reports/jacoco/jacocoRootReport/jacocoRootReport.xml
          retention-days: 7

      - name: Upload the test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: goTest-reports
          path: |
            etendo_core/build/reports/tests/goTestUnit
            etendo_core/build/reports/tests/test
            etendo_core/build/reports/tests/goIsolatedDalTest
          retention-days: 7
          if-no-files-found: ignore

  # SonarQube analysis fed with the coverage of the goTest job: a pull request analysis on a PR, a
  # branch analysis on a push (the scan action tells them apart, as in the former Sonar Build).
  sonar:
    name: Sonar Build
    needs: go-test
    # PRs always run it (it fails when goTest did not succeed, see the last step); pushes analyze
    # only with real coverage, so develop's and main's coverage on Sonar is never a partial one.
    if: ${{ !cancelled() && (github.event_name == 'pull_request' || needs.go-test.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      # As the former Sonar Build did: without it the scanner treats the module as a Gradle build.
      - name: Delete build.gradle
        run: rm -f build.gradle

      - name: Download the coverage report
        if: needs.go-test.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: go-coverage
          path: coverage

      - uses: sonarsource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_SCANNER_OPTS: "-Xmx4096m"
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: ${{ needs.go-test.result == 'success' && '-Dsonar.coverage.jacoco.xmlReportPaths=coverage/jacocoRootReport.xml' || '' }}

      # Same rule as Jenkins' Compare Coverage Results; fails this check on a drop, or when the
      # coverage cannot be evaluated (--context ci).
      - name: Compare coverage with the base branch
        if: github.event_name == 'pull_request' && needs.go-test.result == 'success'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_READ_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_BRANCH: ${{ github.base_ref }}
        run: |
          set -o pipefail
          python3 scripts/compare-sonar-coverage.py --context ci --pull-request "$PR_NUMBER" \
            --base-branch "$BASE_BRANCH" --report-task .scannerwork/report-task.txt | tee -a "$GITHUB_STEP_SUMMARY"

      # Fail closed: a PR whose tests failed (or did not finish) must not get a green required
      # check just because the coverage comparison was skipped.
      - name: Fail when the tests did not succeed
        if: github.event_name == 'pull_request' && needs.go-test.result != 'success'
        env:
          TEST_RESULT: ${{ needs.go-test.result }}
        run: |
          echo "::error title=Coverage gate::goTest ended '$TEST_RESULT', so coverage was not evaluated. Fix the tests and push again."
          exit 1
