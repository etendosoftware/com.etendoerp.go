name: Full Pipeline Pilot

# ETP-6149: the go full pipeline (Jenkins etendo-go-tests) as parallel GitHub Actions jobs, run in
# shadow next to Jenkins on the PRs into main. Jenkins runs it almost all in series: a successful
# run takes a median 103 min, and a failure re-runs all of it. Here each block is its own job, so
# a failed block re-runs alone ("Re-run failed jobs"). This is not a required check: the pilot
# compares duration and failures per block with Jenkins before anything is replaced.
#
# Both jobs build the environment the way Jenkins builds it (.github/actions/etendo-env:
# etendo-localenv, its own PostgreSQL, install, the GOClient seeds, smartbuild):
#   go-tests     the module's Java suite, both halves, and the JaCoCo report. Sonar and the
#                coverage comparison stay in Jenkins during the pilot: a second analysis of the
#                same branch would overwrite the one Jenkins publishes.
#   integration  Tomcat, jsreport and E2E_SUITE=integration from schema_forge, the same 57 specs
#                as Jenkins.
# The Mocked E2E block is left out: the schema_forge pipeline runs the same suite on the same
# branch of the cut.
#
# Secrets: ETENDOBOT_TOKEN reads etendo_core, schema_forge, etendo-localenv, the GitHub modules
# and the npm packages; NEXUS_USER/NEXUS_PASSWORD resolve dependencies; BITBUCKET_SSH_KEY clones
# the Bitbucket modules listed in jenkinsExtraModules.txt.

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
  push:
    branches: [feature/ETP-6149]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-pipeline-pilot-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CORE_BRANCH: epic/ETP-3504
  MODULE_BRANCH: ${{ github.head_ref || github.ref_name }}

jobs:
  go-tests:
    name: Go tests + coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout etendo_core
        uses: actions/checkout@v4
        with:
          repository: etendosoftware/etendo_core
          token: ${{ secrets.ETENDOBOT_TOKEN }}
          ref: ${{ env.CORE_BRANCH }}
          path: etendo_core

      - name: Checkout com.etendoerp.go
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: etendo_core/modules/com.etendoerp.go

      - name: Build the Etendo GO environment
        uses: ./etendo_core/modules/com.etendoerp.go/.github/actions/etendo-env
        with:
          etendobot_token: ${{ secrets.ETENDOBOT_TOKEN }}
          nexus_user: ${{ secrets.NEXUS_USER }}
          nexus_password: ${{ secrets.NEXUS_PASSWORD }}
          bitbucket_ssh_key: ${{ secrets.BITBUCKET_SSH_KEY }}
          core_branch: ${{ env.CORE_BRANCH }}
          module_branch: ${{ env.MODULE_BRANCH }}
          base_ref: ${{ github.base_ref }}

      # Jenkins runs `test --tests "com.etendoerp.go.*"` (the database-free half, finalized by
      # goIsolatedDalTest) and then jacocoRootReport. Here all three go in one Gradle invocation:
      # each separate call pays ~2.5 min of configuration. jacocoRootReport depends on no test
      # task, it reads every build/jacoco/*.exec; listed last it runs after both halves, and
      # --continue still runs it, and goIsolatedDalTest, when goTestUnit fails.
      - name: Go tests and coverage report
        working-directory: etendo_core
        run: ./gradlew goTestUnit goIsolatedDalTest jacocoRootReport --continue

      # The figures to set against Jenkins' "Etendo Go Tests" stage: tests by outcome and the line
      # coverage of com.etendoerp.go in the merged report.
      - name: Summary
        if: always()
        working-directory: etendo_core
        run: |
          python3 - <<'EOF' | tee -a "$GITHUB_STEP_SUMMARY"
          import glob, xml.etree.ElementTree as ET
          rows = {}
          for f in glob.glob('build/test-results/*/*.xml'):
              task = f.split('/')[2]
              r = ET.parse(f).getroot()
              t = rows.setdefault(task, [0, 0, 0, 0])
              t[0] += int(r.get('tests', 0)); t[1] += int(r.get('failures', 0))
              t[2] += int(r.get('errors', 0)); t[3] += int(r.get('skipped', 0))
          print('## Go tests\n\n| Task | Tests | Failures | Errors | Skipped |\n| --- | --- | --- | --- | --- |')
          for task, (n, fl, er, sk) in sorted(rows.items()):
              print(f'| {task} | {n} | {fl} | {er} | {sk} |')
          xml = 'build/reports/jacoco/jacocoRootReport/jacocoRootReport.xml'
          try:
              root = ET.parse(xml).getroot()
          except (OSError, ET.ParseError):
              print('\nNo JaCoCo report.')
          else:
              miss = cov = 0
              for pkg in root.iter('package'):
                  if not pkg.get('name', '').startswith('com/etendoerp/go'):
                      continue
                  for c in pkg.findall('counter'):
                      if c.get('type') == 'LINE':
                          miss += int(c.get('missed')); cov += int(c.get('covered'))
              if cov + miss:
                  print(f'\nLine coverage of com.etendoerp.go: **{100 * cov / (cov + miss):.1f} %** ({cov} of {cov + miss} lines)')
          EOF
          df -h / | tee -a "$RUNNER_TEMP/disk.txt"

      - name: Upload the test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-tests-reports
          path: |
            etendo_core/build/reports/tests/goTestUnit
            etendo_core/build/reports/tests/goIsolatedDalTest
            etendo_core/build/reports/jacoco/jacocoRootReport/jacocoRootReport.xml
          retention-days: 7
          if-no-files-found: ignore

  integration:
    name: Integration (Tomcat + Playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    # schema_forge's run-e2e-full.sh reuses a jsreport already listening on 5488, as with the
    # Jenkins sidecar: the printable specs render through it.
    services:
      jsreport:
        image: etendo/jsreport:develop
        ports:
          - 5488:5488
    steps:
      # The first run started with 85 GB free and used about 7 (no SDK cleanup needed).
      - name: Disk before the build
        run: df -h / | tee -a "$RUNNER_TEMP/disk.txt"

      - name: Checkout etendo_core
        uses: actions/checkout@v4
        with:
          repository: etendosoftware/etendo_core
          token: ${{ secrets.ETENDOBOT_TOKEN }}
          ref: ${{ env.CORE_BRANCH }}
          path: etendo_core

      - name: Checkout com.etendoerp.go
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: etendo_core/modules/com.etendoerp.go

      - name: Build the Etendo GO environment
        uses: ./etendo_core/modules/com.etendoerp.go/.github/actions/etendo-env
        with:
          etendobot_token: ${{ secrets.ETENDOBOT_TOKEN }}
          nexus_user: ${{ secrets.NEXUS_USER }}
          nexus_password: ${{ secrets.NEXUS_PASSWORD }}
          bitbucket_ssh_key: ${{ secrets.BITBUCKET_SSH_KEY }}
          core_branch: ${{ env.CORE_BRANCH }}
          module_branch: ${{ env.MODULE_BRANCH }}
          base_ref: ${{ github.base_ref }}

      - name: Start Tomcat
        working-directory: etendo_core
        env:
          LE: ${{ github.workspace }}/etendo-localenv/bin/local-env.sh
          LOCALENV_CACHE: ${{ runner.temp }}/localenv-cache
          LOCALENV_UPDATE_CHECK_SECS: '0'
        run: |
          "$LE" start --tomcat
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/etendo >/dev/null && exit 0
            sleep 5
          done
          echo "::error::Etendo did not answer on http://localhost:8080/etendo"
          tail -100 build/local-env/tomcat.log
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: etendo_core/schema_forge/package-lock.json
          registry-url: https://npm.pkg.github.com

      - name: Install schema_forge
        working-directory: etendo_core/schema_forge
        env:
          NODE_AUTH_TOKEN: ${{ secrets.ETENDOBOT_TOKEN }}
        run: |
          cp .env.example .env
          make install

      - name: Install Chromium
        working-directory: etendo_core/schema_forge
        run: npx playwright install --with-deps chromium

      - name: Integration E2E
        working-directory: etendo_core/schema_forge
        env:
          E2E_SUITE: integration
          E2E_EMAIL_SINK: '1'
          E2E_PROVISIONING_FAILURE: '1'
          PLAYWRIGHT_HTML_REPORT: ${{ github.workspace }}/etendo_core/schema_forge/e2e/playwright-report-integration
        run: make test-e2e-headless

      - name: Disk and memory at the end
        if: always()
        run: |
          df -h / | tee -a "$RUNNER_TEMP/disk.txt"
          free -m
          du -sh etendo_core "$RUNNER_TEMP/localenv-cache" ~/.gradle ~/.cache/ms-playwright 2>/dev/null || true
          echo "## Disk use" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/disk.txt" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-integration
          path: etendo_core/schema_forge/e2e/playwright-report-integration
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload the environment logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-env-logs
          path: etendo_core/build/local-env/*.log
          retention-days: 7
          if-no-files-found: ignore
