/**
 * ETP-4766 — run this module's DAL-backed tests in a JVM of their own, apart from the mocked ones.
 *
 * <p>Mocked tests leave JVM-wide state behind that a DAL test cannot survive. Three leaks are
 * known, and the first two are reported by {@code StaticStateLeakListener}:</p>
 * <ul>
 * <li>an unbalanced {@code OBContext.setAdminMode()}: {@code OBBaseTest}'s
 * {@code TestWatcher.finished()} then throws {@code IllegalStateException: Test case should take
 * care of reseting admin mode correctly...} on whichever DAL test runs next;</li>
 * <li>a {@code JdbcExternalConnectionPool} whose first {@code initPool()} ran under mocked
 * properties and kept an empty pool map: DAL setup then dies with {@code "datasource" is
 * null};</li>
 * <li>a static initializer that failed without a CDI container, such as
 * {@code DefaultJsonDataService}'s {@code WeldUtils.getInstanceFromStaticBeanManager(...)}: the
 * class stays unusable for the rest of the JVM ({@code NoClassDefFoundError: Could not initialize
 * class}). Nothing can repair this one from outside the JVM.</li>
 * </ul>
 *
 * <p>Gradle packs classes into workers in an order that changes whenever a class is added or
 * removed, so which DAL test paid for a leak moved from one merge block to the next. The earlier
 * fix gave each affected class a JVM of its own ({@code forkEvery = 1}) and listed them here by
 * hand; it grew to 18 classes, about half a minute of JVM and DAL start-up each.</p>
 *
 * <p>The DAL tests do not leak into each other: all of them pass together in a single JVM. So the
 * split is by kind instead of by class: the root {@code test} task skips every
 * {@code com.etendoerp.go} {@code *IntegrationTest}, and {@code goIsolatedDalTest} runs them all
 * in one JVM, finalizing {@code test}. Membership is the same naming convention that
 * {@code goTestUnit} and {@code scripts/check-unit-test-classification.sh} already rely on, so a
 * new DAL test needs no entry here. The task keeps its old name because CI publishes its report
 * from {@code build/reports/tests/goIsolatedDalTest}.</p>
 *
 * <p>A {@code --tests} filter given to {@code test} also selects what this task runs, and
 * {@code test} does not fail when such a filter only matches DAL tests, which it no longer runs.
 * A filter that matches no Go DAL test skips this task. JaCoCo coverage is preserved: the root
 * {@code jacocoRootReport} globs {@code build/jacoco/ ** /*.exec}.</p>
 *
 * <p>The root {@code test} task is contributed by the Etendo Gradle plugin and has no editable
 * source in this repository, so both the exclusion and the new task are declared here against
 * {@code rootProject}. See {@code docs/test-jvm-isolation.md}.</p>
 */
// Declared as a local so the closures below capture it lexically, instead of relying on
// property resolution against a delegate that is the root project / the task, not this module.
def dbBackedGoTests = [
        '**/com/etendoerp/go/**/*IntegrationTest.class',
]

// Class names of the Go DAL tests, read from the sources, to tell whether a --tests filter reaches any.
def goIntegrationTestClasses = {
    def root = file('src-test/src')
    def names = []
    if (root.isDirectory()) {
        root.eachFileRecurse(groovy.io.FileType.FILES) { f ->
            if (f.name.endsWith('IntegrationTest.java')) {
                names << (root.toPath().relativize(f.toPath()).toString() - '.java').replace(File.separator, '.')
            }
        }
    }
    names
}

def commandLineFilterReachesGoIntegrationTest = { requestedTestPatterns, classNames ->
    requestedTestPatterns.isEmpty() || requestedTestPatterns.any { pattern ->
        String regex = '^' + pattern.replace('.', '\\.').replace('*', '.*') + '$'
        classNames.any { className ->
            className ==~ regex || pattern.startsWith(className + '.')
        }
    }
}

rootProject.afterEvaluate { rootProj ->
    def rootTest = rootProj.tasks.findByName('test')
    if (rootTest == null) {
        return
    }

    dbBackedGoTests.each { pattern -> rootTest.exclude(pattern) }

    def isolated = rootProj.tasks.findByName('goIsolatedDalTest')
    if (isolated == null) {
        isolated = rootProj.tasks.create('goIsolatedDalTest', Test) { Test t ->
            t.group = 'verification'
            t.description = 'Runs the com.etendoerp.go DAL integration tests together in one JVM, apart from the mocked tests (see modules/com.etendoerp.go/build.gradle).'

            t.testClassesDirs = rootTest.testClassesDirs
            t.classpath = rootTest.classpath

            // One JVM for every DAL test, none shared with mocked tests — the whole point of this task.
            t.forkEvery = 0
            t.maxParallelForks = 1

            t.useJUnitPlatform()
            dbBackedGoTests.each { pattern -> t.include(pattern) }

            // Nothing to run is not an error: the module may be absent from a given build.
            t.filter.failOnNoMatchingTests = false

            // Inherit the root task's environment so the DAL sees the same DB settings.
            t.systemProperties = rootTest.systemProperties
            t.jvmArgs = rootTest.jvmArgs
            t.minHeapSize = rootTest.minHeapSize
            t.maxHeapSize = rootTest.maxHeapSize
            t.workingDir = rootTest.workingDir
            t.environment(rootTest.environment)
        }
    }

    // Command-line --tests patterns reach the root Test task after project configuration, so they
    // are read once the task graph is ready, before either task runs.
    boolean reachesGoDalTest = true
    rootProj.gradle.taskGraph.whenReady { graph ->
        if (!graph.hasTask(rootTest)) {
            return
        }
        def requested = rootTest.filter.commandLineIncludePatterns
        reachesGoDalTest = commandLineFilterReachesGoIntegrationTest(requested, goIntegrationTestClasses())
        if (!requested.isEmpty() && reachesGoDalTest) {
            requested.each { pattern -> isolated.filter.includeTestsMatching(pattern) }
            // The DAL tests this filter selects run in goIsolatedDalTest, not here.
            rootTest.filter.failOnNoMatchingTests = false
        }
    }
    isolated.onlyIf { reachesGoDalTest }

    rootTest.finalizedBy isolated
}

/**
 * ETP-5695 — {@code goTestUnit}: the database-free half of this module's Java suite.
 *
 * <p>The module's test classes split cleanly in two. A few dozen reach {@code OBBaseTest} or
 * {@code WeldBaseTest} through their {@code extends} chain, so they need a live database — and,
 * for the {@code WeldBaseTest} ones, the CDI container that a full {@code ./gradlew install}
 * leaves behind. The rest, the vast majority, are Mockito-only and need nothing but a compiled
 * classpath. {@code scripts/check-unit-test-classification.sh} prints the current count; it is not
 * repeated here because it changes with every new test. Today both halves run in one {@code ./gradlew test --tests "com.etendoerp.go.*"}, which is why
 * the Java suite can only start after the pipeline's install, roughly an hour of job time before
 * its first assertion.</p>
 *
 * <p>This task runs the second half on its own: the suite a developer can run with no Postgres and
 * no Tomcat, and the one a PR pipeline can run before any environment exists. Membership is by
 * naming convention: every {@code *IntegrationTest} is excluded, with no exceptions.</p>
 *
 * <p>{@code scripts/check-unit-test-classification.sh} enforces that split: a new DB-backed test
 * that does not follow the convention fails that check, instead of failing inside a
 * database-less pipeline with a DAL stack trace that looks like an infrastructure problem.</p>
 *
 * <p>It excludes {@code dbBackedGoTests}, declared above with {@code goIsolatedDalTest}. Declared
 * against {@code rootProject} for the same reason as that task: the {@code test} task is contributed by the Etendo Gradle plugin and has no editable source in
 * this repository.</p>
 */
rootProject.afterEvaluate { rootProj ->
    def rootTest = rootProj.tasks.findByName('test')
    if (rootTest == null || rootProj.tasks.findByName('goTestUnit') != null) {
        return
    }

    rootProj.tasks.create('goTestUnit', Test) { Test t ->
        t.group = 'verification'
        t.description = 'Runs the com.etendoerp.go tests that need no database (see modules/com.etendoerp.go/build.gradle).'

        t.testClassesDirs = rootTest.testClassesDirs
        // Resources (Hibernate *.hbm.xml mappings, message bundles, META-INF/services) live next to
        // the sources and reach build/classes only through Etendo's ant compile. A full Gradle
        // recompile wipes them, and a pipeline with no install never runs that compile, so the
        // tests that need them failed for a missing file. The same folders ant copies from go FIRST
        // on the classpath: appended last, an older copy won instead, such as the message bundles
        // inside a com.etendoerp.go jar that a local build leaves in WebContent/WEB-INF/lib. These
        // folders hold no compiled classes, so class loading is unchanged.
        def resourceDirs = ['src', 'src-gen'].collect { rootProj.file(it) }
        ['modules', 'modules_core'].each { parent ->
            def parentDir = rootProj.file(parent)
            if (parentDir.isDirectory()) {
                parentDir.eachDir { module -> resourceDirs << new File(module, 'src') }
            }
        }
        t.classpath = rootProj.files(resourceDirs.findAll { it.isDirectory() }) + rootTest.classpath

        t.useJUnitPlatform()
        t.include '**/com/etendoerp/go/**/*Test.class'
        dbBackedGoTests.each { pattern -> t.exclude pattern }

        // The module may be absent from a given build: nothing to run is not an error.
        t.filter.failOnNoMatchingTests = false

        // Same JVM shape as the root task, so a test that passes here passes there.
        t.systemProperties = rootTest.systemProperties
        t.jvmArgs = rootTest.jvmArgs
        t.minHeapSize = rootTest.minHeapSize
        t.maxHeapSize = rootTest.maxHeapSize
        t.workingDir = rootTest.workingDir
        t.environment(rootTest.environment)
        t.maxParallelForks = rootTest.maxParallelForks
        t.forkEvery = rootTest.forkEvery
    }

    // goTestUnit's own coverage, read by scripts/check-diff-coverage.py. jacocoRootReport merges
    // every *.exec under build/jacoco, stale ones from earlier runs included; this report reads
    // only goTestUnit.exec and only this module's classes, so it describes the run that just ended.
    rootProj.tasks.create('goTestUnitCoverageReport', JacocoReport) { JacocoReport r ->
        r.group = 'verification'
        r.description = 'JaCoCo XML of the last goTestUnit run, com.etendoerp.go classes only.'
        r.mustRunAfter rootProj.tasks.named('goTestUnit')
        r.executionData.setFrom(rootProj.file("${rootProj.buildDir}/jacoco/goTestUnit.exec"))
        r.sourceDirectories.setFrom(rootProj.files('modules/com.etendoerp.go/src'))
        r.classDirectories.setFrom(rootProj.fileTree(dir: "${rootProj.buildDir}/classes",
                include: 'com/etendoerp/go/**/*.class'))
        r.reports {
            xml.required = true
            html.required = false
            csv.required = false
            xml.outputLocation = rootProj.file(
                    "${rootProj.buildDir}/reports/jacoco/goTestUnit/goTestUnit.xml")
        }
    }
}

/**
 * Tests de schemaforge separados por célula (ventas, compras, almacenes, financiero, contabilidad, localizacion, plataforma).
 *
 * <p>Cada célula es un archivo {@code src-test/cells/<célula>.txt} con una clase de test por
 * línea. Las clases {@code *IntegrationTest} usan la base de datos; el resto
 * son con mocks. Los tests que pertenecen a varias células van en
 * {@code src-test/cells/compartidos/<grupo>.txt}, y cada célula los suma con una línea
 * {@code @incluye <grupo>}. Ejemplos:</p>
 *
 * <pre>
 *   ./gradlew goCellTest -Pcell=ventas                      # mocks + integración de ventas
 *   ./gradlew goCellTest -Pcell=ventas,compras -Pkind=mock  # solo los de mocks
 *   ./gradlew goCellTest -Pcell=all -Pkind=integration      # todos los de integración
 *   ./gradlew goCellList                                    # células y número de tests
 *   ./gradlew goCellCheck                                   # falla si hay tests sin célula
 * </pre>
 *
 * <p>Los de integración se ejecutan en {@code goCellIntegrationTest}, en una JVM sin tests de mocks,
 * por el mismo motivo que {@code goIsolatedDalTest} (ver arriba). Los de mocks, en
 * {@code goCellMockTest}.</p>
 */
def cellsDir = file('src-test/cells')
def schemaforgeTestsDir = file('src-test/src/com/etendoerp/go/schemaforge')

def sharedCellsDir = new File(cellsDir, 'compartidos')

// Clases listadas directamente en cada archivo, sin resolver los '@incluye': una entrada por archivo
// ('ventas', 'compartidos/ventas-compras', ...). Es lo que valida goCellCheck.
def readCellFiles = {
    def files = [:] as TreeMap
    def readDir = { File dir, String prefix ->
        dir.listFiles({ f -> f.isFile() && f.name.endsWith('.txt') } as FileFilter)?.each { f ->
            files[prefix + (f.name - '.txt')] = f.readLines('UTF-8')*.trim()
                    .findAll { it && !it.startsWith('#') }
        }
    }
    readDir(cellsDir, '')
    readDir(sharedCellsDir, 'compartidos/')
    files
}

// Células ejecutables con sus clases, incluyendo los grupos compartidos ('@incluye ventas-compras').
def readCells = {
    def files = readCellFiles()
    def cells = [:] as TreeMap
    files.findAll { !it.key.startsWith('compartidos/') }.each { cell, lines ->
        cells[cell] = lines.collectMany { line ->
            if (!line.startsWith('@incluye ')) {
                return [line]
            }
            String shared = 'compartidos/' + line.substring('@incluye '.length()).trim()
            if (!files.containsKey(shared)) {
                throw new GradleException("La célula ${cell} incluye ${shared}.txt, que no existe en src-test/cells/")
            }
            files[shared]
        }.unique()
    }
    cells
}

def isIntegrationTest = { String className -> className ==~ /.*IntegrationTest$/ }

def selectedCellTests = { String kind ->
    def cells = readCells()
    String requested = rootProject.findProperty('cell')?.toString()
    if (!requested) {
        throw new GradleException("Indica la célula con -Pcell=<${cells.keySet().join('|')}|all>")
    }
    def names = requested == 'all' ? cells.keySet() : requested.split(',')*.trim()
    def unknown = names.findAll { !cells.containsKey(it) }
    if (unknown) {
        throw new GradleException("Célula desconocida: ${unknown.join(', ')}. Disponibles: ${cells.keySet().join(', ')}")
    }
    String wanted = rootProject.findProperty('kind')?.toString() ?: 'all'
    if (!(wanted in ['mock', 'integration', 'all'])) {
        throw new GradleException("-Pkind debe ser mock, integration o all (recibido: ${wanted})")
    }
    if (wanted != 'all' && wanted != kind) {
        return []
    }
    names.collectMany { cells[it] }.unique().findAll { isIntegrationTest(it) == (kind == 'integration') }
}

rootProject.afterEvaluate { rootProj ->
    def rootTest = rootProj.tasks.findByName('test')
    if (rootTest == null || rootProj.tasks.findByName('goCellTest') != null) {
        return
    }

    def cellTask = { String name, String kind ->
        rootProj.tasks.create(name, Test) { Test t ->
            t.group = 'verification'
            t.description = "Tests de schemaforge (${kind}) de las células indicadas con -Pcell."
            t.testClassesDirs = rootTest.testClassesDirs
            t.classpath = rootTest.classpath
            t.useJUnitPlatform()
            t.systemProperties = rootTest.systemProperties
            t.jvmArgs = rootTest.jvmArgs
            t.minHeapSize = rootTest.minHeapSize
            t.maxHeapSize = rootTest.maxHeapSize
            t.workingDir = rootTest.workingDir
            t.environment(rootTest.environment)
            t.filter.failOnNoMatchingTests = false
            // Siempre se ejecutan: el resultado depende de -Pcell/-Pkind, no de las entradas.
            t.outputs.upToDateWhen { false }

            // Solo se lee -Pcell cuando se pide una de estas tareas, para no romper el resto de builds.
            def runsCellTests = rootProj.gradle.startParameter.taskNames.any { taskName ->
                taskName.tokenize(':').last() in ['goCellTest', 'goCellMockTest', 'goCellIntegrationTest']
            }
            def selected = runsCellTests ? selectedCellTests(kind) : []
            selected.each { className -> t.filter.includeTestsMatching(className) }
            t.onlyIf { !selected.isEmpty() }
        }
    }

    def mockTask = cellTask('goCellMockTest', 'mock')
    def integrationTask = cellTask('goCellIntegrationTest', 'integration')
    integrationTask.mustRunAfter mockTask

    rootProj.tasks.create('goCellTest') { t ->
        t.group = 'verification'
        t.description = 'Tests de schemaforge por célula: -Pcell=ventas[,compras|all] -Pkind=mock|integration|all'
        t.dependsOn mockTask, integrationTask
    }

    rootProj.tasks.create('goCellList') { t ->
        t.group = 'verification'
        t.description = 'Lista las células de tests de schemaforge y cuántos tests tiene cada una.'
        t.doLast {
            readCells().each { cell, tests ->
                int integration = tests.count { isIntegrationTest(it) }
                println String.format('%-28s mocks=%3d  integración=%2d', cell, tests.size() - integration, integration)
            }
        }
    }

    rootProj.tasks.create('goCellCheck') { t ->
        t.group = 'verification'
        t.description = 'Falla si algún test de schemaforge no está en ninguna célula o está en varias.'
        t.doLast {
            // Cada clase debe estar en un solo archivo; una célula puede además incluir grupos compartidos.
            readCells()
            def assigned = readCellFiles().collectMany { cell, tests ->
                tests.findAll { !it.startsWith('@incluye ') }.collect { [it, cell] }
            }
            def byClass = assigned.groupBy { it[0] }
            def existing = []
            schemaforgeTestsDir.eachFileRecurse(groovy.io.FileType.FILES) { f ->
                if (!f.name.endsWith('.java')) {
                    return
                }
                String src = f.getText('UTF-8')
                if (src =~ /@(org\.junit\.(jupiter\.api\.)?)?(Test|ParameterizedTest)\b/ && !(src =~ /abstract\s+class/)) {
                    String rel = schemaforgeTestsDir.toPath().relativize(f.toPath()).toString()
                    existing << 'com.etendoerp.go.schemaforge.' + (rel - '.java').replace(File.separator, '.')
                }
            }
            def missing = existing - byClass.keySet()
            def stale = byClass.keySet() - existing
            def duplicated = byClass.findAll { it.value.size() > 1 }
            missing.each { println "Sin célula: ${it}" }
            stale.each { println "En una célula pero ya no existe: ${it}" }
            duplicated.each { k, v -> println "En varias células (${v*.getAt(1).join(', ')}): ${k}" }
            if (missing || stale || duplicated) {
                throw new GradleException("Revisa src-test/cells/: ${missing.size()} sin célula, ${stale.size()} obsoletos, ${duplicated.size()} duplicados.")
            }
            println "OK: ${existing.size()} tests de schemaforge, cada uno en un solo archivo de célula."
        }
    }
}
