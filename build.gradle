/**
 * ETP-4766 — run DAL-backed integration tests in their own JVM.
 *
 * <p>{@code ReactivatePaymentHandlerRemoveIntegrationTest} extends {@code OBBaseTest}, whose
 * {@code @BeforeClass} initializes the DAL layer. When it shares a Gradle test worker with the
 * mocked handler tests that run before it, the Apache JDBC pool singleton is left without a
 * datasource, and DAL initialization dies with:</p>
 *
 * <pre>
 *   OBException: Failed to load reference classes
 *    └─ NPE: DataSource.getConnection() — "datasource" is null
 *       at OBBaseTest.staticInitializeDalLayer(OBBaseTest.java:447)
 * </pre>
 *
 * <p>This is state leaking across classes inside one JVM, not a missing database: the other
 * {@code OBBaseTest} subclasses in this module initialize the DAL fine in the very same run. It
 * surfaced when this merge block added enough test classes to change how Gradle distributes them
 * across workers, which is also why it reproduces identically instead of coming and going.</p>
 *
 * <p>ETP-4722 added a second symptom of the same contamination: a test whose assertions all
 * PASSED still fails because {@code OBBaseTest}'s {@code TestWatcher.finished()} finds the
 * admin-mode stack dirty and throws {@code IllegalStateException: Test case should take care of
 * reseting admin mode correctly...}. {@code OBContext.adminModeStack} is a static
 * {@code ThreadLocal} that {@code OBContext.setOBContext()} does not reset, and Gradle reuses one
 * "Test worker" thread across classes, so an unbalanced {@code setAdminMode()} left by any earlier
 * test in the worker is charged to whichever {@code OBBaseTest} subclass runs next. See
 * {@code docs/test-jvm-isolation.md} for both symptoms.</p>
 *
 * <p>The fix isolates the affected class into its own {@code Test} task with {@code forkEvery = 1},
 * so it always gets a pristine JVM. It is wired as {@code finalizedBy} the root {@code test} task
 * rather than as a separate CI step, so it keeps running in Jenkins without touching the pipeline
 * definition, and its failures still fail the build. A focused test run whose command-line filter
 * cannot select any of these Go tests skips this unrelated finalizer; an unfiltered run or a
 * filter that reaches a Go isolated test still executes it. JaCoCo coverage is preserved: the root
 * {@code jacocoRootReport} globs {@code build/jacoco/ ** /*.exec}, which picks up the new task's
 * execution data automatically.</p>
 *
 * <p>The root {@code test} task is contributed by the Etendo Gradle plugin and has no editable
 * source in this repository, so both the exclusion and the new task are declared here against
 * {@code rootProject}.</p>
 */
// Declared as a local so the closures below capture it lexically, instead of relying on
// property resolution against a delegate that is the root project / the task, not this module.
def isolatedDalTests = [
        '**/ReactivatePaymentHandlerRemoveIntegrationTest.class',
        '**/CreateDraftInvoiceHandlerNegativeQuantityIntegrationTest.class',
        '**/CreateDraftInvoiceHandlerPriceListRequiredIntegrationTest.class',
        '**/CreateGoodsReceiptHandlerNegativeQuantityIntegrationTest.class',
        '**/CreatePurchaseInvoiceHandlerNegativeQuantityIntegrationTest.class',
        '**/AbstractInvoiceHeaderHandlerOriginInvoiceIntegrationTest.class',
]

def isolatedDalTestClasses = [
        'com.etendoerp.go.schemaforge.handlers.ReactivatePaymentHandlerRemoveIntegrationTest',
        'com.etendoerp.go.schemaforge.CreateDraftInvoiceHandlerNegativeQuantityIntegrationTest',
        'com.etendoerp.go.schemaforge.CreateDraftInvoiceHandlerPriceListRequiredIntegrationTest',
        'com.etendoerp.go.schemaforge.CreateGoodsReceiptHandlerNegativeQuantityIntegrationTest',
        'com.etendoerp.go.schemaforge.CreatePurchaseInvoiceHandlerNegativeQuantityIntegrationTest',
        'com.etendoerp.go.schemaforge.AbstractInvoiceHeaderHandlerOriginInvoiceIntegrationTest',
]

def commandLineFilterReachesIsolatedGoTest = { requestedTestPatterns ->
    requestedTestPatterns.isEmpty() || requestedTestPatterns.any { pattern ->
        String regex = '^' + pattern.replace('.', '\\.').replace('*', '.*') + '$'
        isolatedDalTestClasses.any { className ->
            className ==~ regex || pattern.startsWith(className + '.')
        }
    }
}

rootProject.afterEvaluate { rootProj ->
    def rootTest = rootProj.tasks.findByName('test')
    if (rootTest == null) {
        return
    }

    isolatedDalTests.each { pattern -> rootTest.exclude(pattern) }

    def isolated = rootProj.tasks.findByName('goIsolatedDalTest')
    if (isolated == null) {
        isolated = rootProj.tasks.create('goIsolatedDalTest', Test) { Test t ->
            t.group = 'verification'
            t.description = 'Runs com.etendoerp.go DAL integration tests one per JVM (see modules/com.etendoerp.go/build.gradle).'

            t.testClassesDirs = rootTest.testClassesDirs
            t.classpath = rootTest.classpath

            // A fresh JVM per class — the whole point of this task.
            t.forkEvery = 1
            t.maxParallelForks = 1

            t.useJUnitPlatform()
            isolatedDalTests.each { pattern -> t.include(pattern) }

            // Nothing to run is not an error: the module may be absent from a given build.
            t.filter.failOnNoMatchingTests = false

            // Inherit the root task's environment so the DAL sees the same DB settings.
            t.systemProperties = rootTest.systemProperties
            t.jvmArgs = rootTest.jvmArgs
            t.minHeapSize = rootTest.minHeapSize
            t.maxHeapSize = rootTest.maxHeapSize
            t.workingDir = rootTest.workingDir
            t.environment(rootTest.environment)
        }
    }

    // Command-line --tests patterns are applied to the root Test task after project configuration.
    // Inspect them at execution time: run the finalizer only when its own Go tests are eligible.
    isolated.onlyIf {
        commandLineFilterReachesIsolatedGoTest(rootTest.filter.commandLineIncludePatterns)
    }

    rootTest.finalizedBy isolated
}

/**
 * ETP-5695 — {@code goTestUnit}: the database-free half of this module's Java suite.
 *
 * <p>The module's test classes split cleanly in two. A few dozen reach {@code OBBaseTest} or
 * {@code WeldBaseTest} through their {@code extends} chain, so they need a live database — and,
 * for the {@code WeldBaseTest} ones, the CDI container that a full {@code ./gradlew install}
 * leaves behind. The rest, the vast majority, are Mockito-only and need nothing but a compiled
 * classpath. {@code scripts/check-unit-test-classification.sh} prints the current count; it is not
 * repeated here because it changes with every new test. Today both halves run in one {@code ./gradlew test --tests "com.etendoerp.go.*"}, which is why
 * the Java suite can only start after the pipeline's install, roughly an hour of job time before
 * its first assertion.</p>
 *
 * <p>This task runs the second half on its own: the suite a developer can run with no Postgres and
 * no Tomcat, and the one a PR pipeline can run before any environment exists. Membership is by
 * naming convention — every {@code *IntegrationTest} is excluded — plus two classes that predate
 * the convention and are referenced by name throughout {@code docs/}, so they are excluded by name
 * instead of being renamed.</p>
 *
 * <p>{@code scripts/check-unit-test-classification.sh} enforces that split: a new DB-backed test
 * that does not follow the convention fails that check, instead of failing inside a
 * database-less pipeline with a DAL stack trace that looks like an infrastructure problem.</p>
 *
 * <p>Declared against {@code rootProject} for the same reason as {@code goIsolatedDalTest} above:
 * the {@code test} task is contributed by the Etendo Gradle plugin and has no editable source in
 * this repository.</p>
 */
def dbBackedGoTests = [
        '**/*IntegrationTest.class',
        // Predate the *IntegrationTest convention; both extend a DAL base class.
        '**/UserRoleCompositionServiceOverlapReverificationTest.class',
        '**/BusinessPartnerHandlerDbTest.class',
]

rootProject.afterEvaluate { rootProj ->
    def rootTest = rootProj.tasks.findByName('test')
    if (rootTest == null || rootProj.tasks.findByName('goTestUnit') != null) {
        return
    }

    rootProj.tasks.create('goTestUnit', Test) { Test t ->
        t.group = 'verification'
        t.description = 'Runs the com.etendoerp.go tests that need no database (see modules/com.etendoerp.go/build.gradle).'

        t.testClassesDirs = rootTest.testClassesDirs
        t.classpath = rootTest.classpath

        t.useJUnitPlatform()
        t.include '**/com/etendoerp/go/**/*Test.class'
        dbBackedGoTests.each { pattern -> t.exclude pattern }

        // The module may be absent from a given build: nothing to run is not an error.
        t.filter.failOnNoMatchingTests = false

        // Same JVM shape as the root task, so a test that passes here passes there.
        t.systemProperties = rootTest.systemProperties
        t.jvmArgs = rootTest.jvmArgs
        t.minHeapSize = rootTest.minHeapSize
        t.maxHeapSize = rootTest.maxHeapSize
        t.workingDir = rootTest.workingDir
        t.environment(rootTest.environment)
        t.maxParallelForks = rootTest.maxParallelForks
        t.forkEvery = rootTest.forkEvery
    }
}
